    \ ao aplicar o roxo característico nos macacões da MercedesAMG PETRONAS, criando\
    \ associação visual imediata, enquanto diferentes versões de uniforme conectadas\
    \ à trajetória da empresa ampliam o significado, complementadas por conteúdos\
    \ e experiências que fortalecem o vínculo com territórios culturais relevantes.\n\
    \   Logotipos nos macacões (visíveis): MercedesAMG, UBS, Crowdstrike, Snapdragon,\
    \ PETRONAS, NU, INE(OS), HP(E), Microsoft.\n   Logotipo no canto superior direito\

benchmark_caption: "\U0001F6A8 O Higgsfield Seedance 2.5 estava no ar há menos de\
  \ um dia quando alguém já havia concluído um longa-metragem de 110 minutos usando\
  \ o modelo.\n\nAtualmente, o modelo ocupa o 1º lugar no ranking de imagem para vídeo\
  \ do LMArena, com 1823 de Elo. Em segundo lugar está o minimax-h3, com 1476. As\
  \ variantes do Veo 3.1, do Google, ocupam as posições 8, 9 e 10.\n\nÉ uma diferença\
  \ de 347 pontos, com intervalos de confiança de ±10 e ±19 que nem sequer se sobrepõem.\
  \ O LMArena funciona com votações cegas, comparando dois resultados por vez, então\
  \ quem escolhe o vencedor não sabe qual modelo produziu cada vídeo.\n\nO filme é\
  \ “Cully Hill Boys”, estrelado por N3ON, MK, Rampage Jackson e Israel Adesanya,\
  \ e será lançado em breve no YouTube. Segundo a Higgsfield, o longa inteiro foi\
  \ produzido com o Seedance 2.5 por US$ 2 milhões.\n\nDepois disso, eles zeraram\
  \ o preço. São 33 dias de uso ilimitado do Seedance 2.5 para novos usuários, anunciados\
  \ no mesmo dia em que o modelo assumiu a liderança do ranking.\n\nEles também publicaram\
  \ o processo de produção usado para criar o filme e disponibilizaram US$ 1 milhão\
  \ para filmes produzidos com a ferramenta.\n\nA história aqui não é simplesmente\
  \ que um modelo venceu um ranking. É que a empresa que ocupa o 1º lugar tornou o\
  \ modelo gratuito e ainda revelou o método usado para produzir com ele.\n\nHoje\
  \ à noite, você pode assistir ao que outra pessoa criou, ou começar a construir\
  \ o seu próprio.\n\nO que você acha disso? \U0001F914\U0001F4AC\n\n#HiggsfieldPartner\
  \ \n\n*Publicidade"

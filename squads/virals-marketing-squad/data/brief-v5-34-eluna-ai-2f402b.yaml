benchmark_caption: 'Building your first AI agent is much simpler when you stop trying
  to make it do everything at once.


  Start with 1 clear job, choose a strong model, and connect only the tools needed
  to complete that task.


  The basic loop is simple, the model decides what to do, uses a tool, checks the
  result, and continues.


  Build 1 useful agent first, test it on real tasks, fix what breaks, and add complexity
  only when you actually need it.'

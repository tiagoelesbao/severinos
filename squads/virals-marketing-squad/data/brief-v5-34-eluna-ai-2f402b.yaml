- slide_n: 3
  variant: CONTENT
  role: PAYOFF
  screenshot_ref: Screenshots/slide_03.jpg
  reference_headline: 'Start by wiring the basics:'
  reference_body: '– Input from the user (the task or goal) – Pass it through the
    model with instructions (system prompt) – Let the model decide the next step –
    If a tool is needed (API call, scrape, action), execute it – Feed the result back
    into the model for the next step – Continue until the task is done or the user
    gets a final output This loop - model --> tool --> result --> model is the heartbeat
    of every agent. Not true. Start with just short-term context (the last few messages).
    If your agent needs to remember things across runs, use a database or a simple
    JSON file. Only add vector databases or fancy retrieval when you really need them.
    Once it works, give it a simple interface: – A web dashboard (Flask, FastAPI,
    or Next.js) – A Slack/Discord bot – Or even just a script that runs on your machine
    The point is to make it usable beyond your terminal so you see how it behaves
    in a real workflow. Run real tasks, see where it breaks, patch it, run again.
    Every agent I''ve built has gone through dozens of these cycles before becoming
    reliable. Resist that. A single well-functioning agent that can book an appointment
    or manage your email is worth way more than a "universal agent" that keeps failing.'
  headline: O SEGREDO É DIVIDIR PARA CONQUISTAR
  sub_headline: A LÓGICA
  body_text: Em vez de um comando gigante, use um fluxo modular. O modelo decide o

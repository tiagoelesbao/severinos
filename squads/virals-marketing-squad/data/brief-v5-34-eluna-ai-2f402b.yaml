  screenshot_ref: Screenshots/slide_02.jpg
  reference_headline: r/AgentsOfAI
  reference_body: '353d Building your first AI Agent; A clear path! Discussion I''ve
    seen a lot of people get excited about building AI agents but end up stuck because
    everything sounds either too abstract or too hyped. If you''re serious about making
    your first AI agent, here''s a path you can actually follow. This isn''t (another)
    theory it''s the same process I''ve used multiple times to build working agents.
    Decide on one specific job you want the agent to do. Examples: – Book a doctor’s
    appointment from a hospital website – Monitor job boards and send you matching
    jobs – Summarize unread emails in your inbox The smaller and clearer the problem,
    the easier it is to design and debug. Use something that’s already good enough.
    GPT, Claude, Gemini, or open-source options like LLaMA and Mistral if you want
    to self-host. Just make sure the model can handle reasoning and structured outputs,
    because that’s what agents rely on. This is the core part people skip. An agent
    isn’t just a chatbot but it needs tools. You’ll need to decide what APIs or actions
    it can use. A few common ones: – Web scraping or browsing (Playwright, Puppeeter,
    or APIs if available) – Email API (Gmail API, Outlook API) – Calendar API (Google
    Calendar, Outlook Calendar) – File operations (read/write to disk, parse PDFs,
    etc.)'
  headline: O GARGALO NÃO É A FERRAMENTA, É A ABSTRAÇÃO
  sub_headline: O PROBLEMA
  body_text: A dificuldade de execução geralmente vem da falta de um método de montagem.
    Para construir um agente, é preciso definir a sequência de etapas em vez de tentar
    resolver tudo em um único prompt.

- slide_n: 5
  variant: CONTENT
  role: INSIGHT
  screenshot_ref: Screenshots/slide_05.jpg
  reference_headline: Thales Laray / Thales Laray
  reference_body: 'Se você quer que o Claude trabalhe de forma mais minuciosa e cuidadosa
    em um problema → Aumente o esforço. Na prática: Quando o Claude entendeu o problema,
    mas entregou algo superficial, incompleto, pouco detalhado, sem revisar alguns
    pontos importantes. Nesse caso, talvez você não precise de outro modelo. Precisa
    apenas dar mais tempo para o modelo atual trabalhar. Agora, se o problema for
    especialmente difícil e você quer dar ao Claude mais capacidades → Mude o modelo.
    Na prática: Quando o problema exige um nível de raciocínio, especialização ou
    criatividade que o modelo atual não consegue entregar. Você percebe isso quando,
    mesmo aumentando o esforço, ele continua preso a soluções óbvias ou não consegue
    compreender as nuances do problema. Nesse caso, não está faltando dedicação. O
    modelo atual pode simplesmente não ter a capacidade necessária para resolver aquele
    problema.'
  headline: QUANDO AJUSTAR CADA PARÂMETRO

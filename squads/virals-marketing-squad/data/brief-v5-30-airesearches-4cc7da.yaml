benchmark_caption: 'Markus Persson, better known as Notch, the creator of Minecraft,
  posted just two words on July 14: “Reject AI.” The post reached around 70,000 likes
  and 5.2 million views. Coming from one of gaming’s most respected programmers, it
  carried weight.


  A week later, his tone started changing. He thanked people for tips on AI-assisted
  coding, admitted he would probably stay grumpy about it for a while, and asked who
  he was to resist the inevitable. Soon after, he was already imagining tools he could
  build with AI, including a text editor that could add new features to itself.


  By July 22, he said he needed to give AI a real chance before deciding that being
  against it was worth more than being right. Two days later, he admitted he was running
  out of excuses and had come close to becoming a Luddite.


  Then came the full shift. He started testing Claude, thinking up real use cases
  like converting an entire codebase from one language to another, and was soon praising
  the interface and how well it worked inside his editor.


  From “Reject AI” to actually using it took just 14 days, and he documented the whole
  change of mind in public.'

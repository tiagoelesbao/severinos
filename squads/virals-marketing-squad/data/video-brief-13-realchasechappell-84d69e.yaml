  script: 'Olha isso: eu criei um site Shopify inteiro em tempo recorde. Primeiro,
    eu mando a IA montar o brand kit – cores, fontes, identidade visual – rapidinho.
    Depois ela escaneia seu produto, a linguagem da sua página, a oferta e até as
    objeções mais comuns, tudo a partir do site que você já tem. Com esses dados eu
    aplico o playbook de taxa de conversão que usamos nos nossos maiores lançamentos,
    e a IA desenha e executa a loja pra você. Dá uma olhada no que saiu: a página
    cobre psicologia do comprador, enquadra o problema, mostra credibilidade, cria
    ofertas, upsells, cross‑sells e um walkthrough completo do produto. Se você ainda
    acha que isso é hype, comenta "Claude" aqui embaixo que eu te envio o passo a
    passo completo.'

benchmark_analysis:
  tema_central: Desconstrução da estratégia de volume de conteúdo de Alfredo Soares
    para validar o conceito de Founder-Led Growth.
  formato: Case Study de Estratégia (Deconstruction)
  arco_narrativo: O post começa com um questionamento provocativo (provocação/caos),
    introduz o objeto de estudo (contexto), desmistifica a execução (mecanismo), revela
    o sistema por trás do volume (metodologia), diferencia o objetivo (posicionamento)
    e finaliza com um framework aplicável (utilidade).
  estrutura:
  - slide_n: 1
    papel: 'Hook/Gancho: Contraste entre alto faturamento e alto volume de posts para
      gerar curiosidade.'
    essencial: true
  - slide_n: 2
    papel: 'Contextualização: Estabelece a autoridade do personagem analisado.'
    essencial: false
  - slide_n: 3
    papel: 'Quebra de padrão: Antecipa que o volume não é aleatório, preparando para
      a revelação do segredo.'
    essencial: true
  - slide_n: 4
    papel: 'Explicação do Método: Mostra a origem simples dos temas para desmistificar
      a complexidade.'
    essencial: true
  - slide_n: 5
    papel: 'Mudança de Paradigma: Transição de ''Engajamento'' para ''Confiança/Presença''.'
    essencial: true
  - slide_n: 6
    papel: 'Framework/Processo: Entrega o ''como fazer'' através do Sistema Editorial.'
    essencial: true
  - slide_n: 7
    papel: 'Reforço de Posicionamento: Diferenciação entre Influenciador vs. Empresário.'
    essencial: true
  - slide_n: 8
    papel: 'Conexão com o Business: Demonstra o retorno sobre o investimento (ROI)
      da imagem.'
    essencial: true
  - slide_n: 9
    papel: 'CTA de Valor/Checklist: Entrega uma ferramenta prática para o usuário
      aplicar imediatamente.'
    essencial: true
  redundancias:
  - Slide 2 (Poderia ser fundido ao Slide 1 ou 3 para acelerar o ritmo)
  - Slide 7 (O conceito de não ser apenas um criador é reforçado no Slide 5 e 8, poderia
    ser uma frase de transição)
  fatores_de_performance:
  - 'Contraste de autoridade: O choque entre ''faturamento de 500M'' e ''postar 12x
    por dia''.'
  - 'Desmistificação de esforço: Mostra que o volume vem de processos simples, não
    de produção exaustiva.'
  - 'Entrega de Framework: O post não apenas analisa, ele ensina um sistema (Radar
    + Tese).'
  - 'Alinhamento com o desejo do público: Foca em eficiência e geração de receita,
    não em métricas de vaidade.'
  recomendacao:
    slides_ideais: 6

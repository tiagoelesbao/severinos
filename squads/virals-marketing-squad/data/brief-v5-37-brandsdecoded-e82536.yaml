      mental.'
    essencial: false
  - slide_n: 4
    papel: 'Conceito Chave: Define criatividade como combinação de referências, não
      invenção do zero.'
    essencial: true
  - slide_n: 5
    papel: 'Contraste: Mostra o risco da biblioteca limitada e a quebra do automatismo.'
    essencial: true
  - slide_n: 6

  headline: MARCA BRASILEIRA APRESENTA O PRIMEIRO AÇAÍ COCRIADO COM INTELIGÊNCIA ARTIFICIAL
  body_text: O primeiro açaí feito por inteligência artificial combina tecnologia
    e repertório humano para transformar dados em experiência sensorial inédita, reunindo
    ingredientes de diferentes biomas brasileiros em uma proposta que traduz diversidade,
    enquanto a apresentação no World Creativity Day amplia a narrativa com degustações
    e experiências imersivas.
  accent_color: '#FF5B3F'

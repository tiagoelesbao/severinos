  headline: ADIDAS APRESENTA COLEÇÃO EXCLUSIVA COM UNIFORMES DE SELEÇÕES PARA CACHORROS
  body_text: De olho no comportamento de consumo durante a Copa do Mundo, a Adidas
    expande o uso das camisas para pets, lançando peças inspiradas em seleções como
    Argentina, México, Colômbia e Japão, adaptadas para incluir os animais na experiência.

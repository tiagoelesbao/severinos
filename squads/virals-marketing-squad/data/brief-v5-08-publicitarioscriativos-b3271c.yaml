benchmark_caption: '6,428 likes, 76 comments - publicitarioscriativos on August 10,
  2026: "O fim de uma temporada costuma marcar o encerramento de uma jornada, mas
  para os fãs de Casa do Dragão virou o início de outra: aprender a língua dos Targaryen.
  O desfecho da terceira temporada não gerou apenas repercussão sobre a trama, mas
  também um salto direto no comportamento dos espectadores dentro de outro aplicativo.


  Segundo dados do próprio Duolingo, o número de alunos ativos diariamente no curso
  de Alto Valiriano cresceu 298% no Brasil desde a estreia da temporada, e 651% na
  comparação ano a ano. O curso existe desde 2019, criado em parceria com o linguista
  David J. Peterson, e ensina desde conversas cotidianas até comandos para se comunicar
  com dragões.


  O movimento reforça como o engajamento com uma série pode se estender para muito
  além da tela, transformando entretenimento em comportamento real de consumo.'

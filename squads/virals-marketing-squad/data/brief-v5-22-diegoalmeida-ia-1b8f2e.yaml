  Guillaume Meyer lançou o projeto sob licença MIT, e em poucos dias já passou
  de 4.700 estrelas no GitHub.


  A ferramenta suporta formatos comuns como PNG, JPEG, SVG, PDF, DOCX, HTML e
  Markdown, indo bem além de simples arquivo de texto.


  O repositório também é transparente sobre a troca envolvida, reescrever demais
  pode enfraquecer os sinais de marca d’água, mas também acaba achatando o tom,
  a precisão e a qualidade da escrita original.


  Meyer também avisa que nenhuma ferramenta consegue garantir que um detector
  oficial de fabricante vai falhar, então isso não está sendo vendido como uma
  solução perfeita.


  Link do projeto: github.com/guillaumemeyer/watermarks-remover



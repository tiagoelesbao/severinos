  arco_narrativo: O post inicia com uma promessa disruptiva (remover marcas de
    IA), apresenta a capacidade técnica da ferramenta, prova a existência via
    print do repositório e encerra com um CTA de autoridade.
  estrutura:
    - slide_n: 1
      papel: Gancho de curiosidade e promessa de valor (The Hook).
      essencial: true
    - slide_n: 2
      papel: Explicação técnica e prova de funcionalidades (The How).
      essencial: true
    - slide_n: 3
      papel: Prova social e validação via fonte original/GitHub (The Proof).
      essencial: true
    - slide_n: 4
      papel: Conversão e reforço de branding (The CTA).
      essencial: false
  redundancias:
    - Slide 4 (CTA genérico que pode ser fundido ao slide 3 ou substituído por
      algo mais prático)
  fatores_de_performance:
    - Apelo ao 'hack' ou 'contorno' de sistemas de detecção de IA (curiosidade
      proibida).
    - Referência a players gigantes (Claude, Gemini, ChatGPT) aumentando o
      alcance orgânico.
    - Uso de prova real (screenshot do GitHub) que gera confiança imediata no
      nicho dev/tech.
    - Headline direta e focada no benefício imediato.

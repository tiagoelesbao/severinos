restricoes:
  nunca_fazer:
    - "Corporativês / jargões de consultoria (sinergia, alavancar, holisticamente)"
    - "Promessa vazia sem prova rodando ('vamos automatizar seu processo' sem mostrar sistema)"
    - "Inventar case ou número de cliente que não existe — a prova é o próprio sistema, não depoimento fabricado"
    - "Auto-ajuda genérica ('acredite, sonhe grande', frases de pão-de-queijo motivacional)"
    - "Exposição de clientes/sócios sem autorização explícita"
    - "Política / polêmica fora de escopo"
    - "Conteúdo AI genérico — imagem stock óbvia ou texto plano de ChatGPT sem voz humana"
    - "Pose de guru — 'meu método secreto', 'eu ensinei o mercado', etc."
  sempre_fazer:
    - "Citar número, evidência, bastidor OU sistema rodando em toda afirmação"
    - "Mostrar o log de produção sempre que possível (screen recording, dashboard, benchmark real)"
    - "Dar crédito à fonte quando o conteúdo vier de um curso/vídeo estudado (learn in public)"
    - "Falar a língua nativa do nicho-alvo (D2C, infoproduto, agência ou clínica — sem traduzir o óbvio)"
    - "Usar primeira pessoa real ('eu fiz', 'a gente errou', 'olha o sistema rodando')"
    - "Encerrar com pergunta provocadora ou convite a VER o sistema (nunca CTA de venda agressivo)"
    - "Quando citar IA, dar exemplo concreto de uso (agente, automação, pipeline deste projeto)"

cta_estilo:
  preferencia: "call-to-think (provocação intelectual) + convite a VER o sistema > call-to-action de venda direta"
  exemplos_bons:
    - "Você está olhando esse gráfico do jeito errado. Repara aqui ↓"
    - "Se você é founder e ainda testa criativo no escuro, está atrasado."
    - "Quer ver isso rodando no seu nicho? Comento como embaixo."
    - "Esse é o log do sistema essa semana. Quem ainda acha que automação é promessa, vou esperar."
  exemplos_proibidos:
    - "Chama no DM!"
    - "Link na bio!"
    - "Comenta 'EU QUERO' aqui embaixo!"
  ponte_de_conversao: >
    Quando fizer sentido, convidar para o Tier 1 (benchmark one-shot) como quem
    oferece uma demonstração — "quer ver o benchmark do SEU nicho?" — não como
    venda direta. A demonstração é a oferta.


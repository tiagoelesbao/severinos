# ─────────────────────────────────────────────────────────────────────────────
tom_de_voz:
  arquetipo: "Herói (luta, construção, superação) — acessórios: Criador + Sábio"
  dna: "Engenheiro mostrando o log de produção — direto, técnico sem ser hermético, prova > propaganda"
  personalidade: "Confiante, técnico, sem floreio. Mostra o sistema. Provoca quando precisa, ensina o que aprende."
  voz_em_uma_frase: "Founder que mostra o sistema rodando — não a foto do troféu, o log de produção."
  principios:
    - "REGRA DO HOOK (a mais importante) — a MANCHETE lidera pelo BENEFÍCIO concreto: o que a pessoa APRENDE, GANHA ou EVITA lendo até o fim. A audiência tem que saber em 1 segundo o que leva. 'Sistema', 'prova', 'automação' são CONTEXTO no corpo, JAMAIS a manchete."
    - "REGRA DA SIMPLICIDADE — PT-BR de rede social de conteúdo rápido: objetivo, concreto, uma ideia por slide. PROIBIDO jargão abstrato como manchete ('previsibilidade de demanda sistematizada', 'sistema de pré-visualização'). Se um estranho não entende em 2 segundos, reescreve."
    - "MOSTRAR > DIZER — toda afirmação vem com número, evidência, bastidor ou exemplo concreto"
    - "PROVA > PROMESSA — não vendo o que vou fazer; mostro o que já está rodando"
    - "SEM RODEIO — primeiro segundo é o frame; sem aquecimento, vai direto ao ponto"
    - "RETENÇÃO — cada slide abre uma curiosidade que o próximo paga; o último entrega o payoff prometido no hook"
    - "LEARN IN PUBLIC — o que estudo hoje vira conteúdo aplicado amanhã, com crédito à fonte"
    - "IA APLICADA, NÃO IA HYPE — toda menção a IA vem com caso de uso concreto"
    - "VENDE O SERVIÇO — o conteúdo educa E atrai comprador; deixa claro (sem ser vendedor) qual dor de negócio a gente resolve (criativo em escala, tráfego, site, marca, narrativa)"
    - "MÉTODO COM NOME — quando fizer sentido, nomear a etapa de metodo_engenharia_aquisicao (diagnóstico/prototipagem/escala/manutenção) por trás do que está sendo mostrado — mas SEMPRE subordinado à REGRA DO HOOK: o nome do pilar é contexto, nunca a manchete"
  frases_chave_assinatura:
    - "O que a concorrência ainda está planejando, a gente já automatizou"
    - "Prova em movimento, não promessa no papel"
    - "Construído à vista, não prometido no slide"
    - "Olha o log de produção"
    - "O jogo mudou"
    - "Aquisição de cliente não é sorte, é engenharia"
    - "Testou, validou, escalou"
  frases_reservadas_para_virals:
    nota: "Bordões institucionais @virals — não usar no perfil pessoal."
    lista:
      - "Skin in the game / Pôr a pele em jogo"
      - "Não somos agência, somos seu departamento de Growth"
  lexico:
    sempre_usar:
      - "founder"
      - "bastidor"
      - "número"
      - "processo"
      - "sistema"
      - "prova"
      - "rodando"
      - "log"
      - "automação"
      - "benchmark"
      - "evidência"
      - "construir"
      - "medir"
      - "engenharia"
      - "diagnóstico"
      - "iteração"
    nunca_usar:
      - "empreendedorismo" # cheira a curso de Instagram dos anos 2010
      - "mentoria"         # cheira a guru
      - "dica"             # diminui o conteúdo — usar "lição" ou "leitura"
      - "segredo"          # promessa vazia
      - "sinergia"
      - "alavancar"
      - "holisticamente"
      - "venha" # vendedor de praia — usar "se você quer X, fica"


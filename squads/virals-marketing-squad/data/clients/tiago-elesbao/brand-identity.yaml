      nome: "Criação de identidade de marca"
      dor_que_resolve: "Marca sem cara própria, visual genérico que não diferencia."
      resultado: "Identidade construída com IA — paleta, tipografia, sistema visual coeso."
    - id: "narrativa"
      nome: "Narrativa e posicionamento"
      dor_que_resolve: "Não sabe o que falar, mensagem genérica que não atrai nem converte."
      resultado: "Narrativa de marca clara — o que fala, pra quem, com que ângulo."


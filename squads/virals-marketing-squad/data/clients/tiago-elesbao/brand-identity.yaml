# ─────────────────────────────────────────────────────────────────────────────
# Nome do método por trás da "prova em movimento" — não é personagem, é rótulo
# pro sistema que já existe (ver negocios_para_bastidor e portfolio_servicos).
# "Prova em movimento" é A TESE (o que a audiência vê); "Engenharia de
# Aquisição" é o NOME do método que a prova documenta. Sem metáfora de luta,
# sem persona construída — só o rigor que já é real no sistema.
metodo_engenharia_aquisicao:
  tese: "Aquisição de cliente não é sorte, é engenharia — hipótese, teste, dado e iteração, com o mesmo rigor que qualquer sistema de produção exige."
  pilares:
    - nome: "Diagnóstico"
      o_que_e: "Mapear onde está o gargalo real (oferta, criativo, dado, retenção) antes de propor solução."
    - nome: "Prototipagem"
      o_que_e: "Testar barato e estruturado antes de escalar — o benchmark one-shot (Tier 1) é a prototipagem em produto."
    - nome: "Escala"
      o_que_e: "Só o que passou em validação recebe budget/automação — nunca escalar palpite."
    - nome: "Manutenção"
      o_que_e: "O sistema é monitorado e ajustado continuamente (o próprio ETL de monitoramento é manutenção em produção)."
  uso_em_conteudo: >
    Nomear o pilar quando fizer sentido no contexto real do que está sendo
    mostrado (ex.: "isso aqui é a etapa de diagnóstico" sobre um dashboard de
    benchmark) — nunca como jargão solto sem evidência atrás. Se a REGRA DA
    SIMPLICIDADE do tom_de_voz e o nome do pilar entrarem em conflito, a regra
    da simplicidade vence: o pilar é contexto, o benefício continua sendo o hook.


perfil:
  identidade: "Tiago Elesbão"
  handle: "@tiagoelesbao"
  papel: "Founder da Virals · Construtor de sistemas de automação e IA para aquisição"
  objetivo_perfil: "Autoridade + geração de demanda B2B (topo de funil para os serviços de automação/IA)"
  posicionamento: |
    O founder que constrói à vista um sistema de automação/IA para aquisição —
    monitoramento competitivo, benchmark e fábrica de criativos — e mostra o
    processo rodando em tempo real como conteúdo. Prova em movimento, não
    promessa no papel.
  big_idea: "Construído à vista, não prometido no slide — o log de produção como conteúdo"
  promessa_central: "O que a concorrência ainda está planejando, a gente já automatizou, mediu e otimizou."
  manifesto: >
    Founder não posa de guru. Mostra o trabalho, o erro, o número — e o sistema
    rodando. Enquanto o mercado VENDE automação como promessa, eu MOSTRO a
    automação como log de produção: o ETL monitorando, os agentes trabalhando, o
    criativo saindo do benchmark. Não tenho case de cliente ainda — tenho algo
    que ninguém consegue fingir: o sistema funcionando ao vivo. O bastidor da
    construção é o novo conteúdo nobre. E quem tem fome assiste até o fim.


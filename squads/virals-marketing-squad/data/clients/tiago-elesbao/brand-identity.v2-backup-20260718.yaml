# ─────────────────────────────────────────────────────────────────────────────
tom_de_voz:
  arquetipo: "Herói (luta, construção, superação) — acessórios: Criador + Sábio"
  dna: "Engenheiro mostrando o log de produção — direto, técnico sem ser hermético, prova > propaganda"
  personalidade: "Confiante, técnico, sem floreio. Mostra o sistema. Provoca quando precisa, ensina o que aprende."
  voz_em_uma_frase: "Founder que mostra o sistema rodando — não a foto do troféu, o log de produção."
  principios:
    - "MOSTRAR > DIZER — toda afirmação vem com número, evidência, bastidor ou sistema rodando"
    - "PROVA > PROMESSA — não vendo o que vou fazer; mostro o que já está rodando"
    - "SEM RODEIO — primeiro segundo é o frame; sem aquecimento, vai direto ao ponto"
    - "BASTIDOR É CONTEÚDO NOBRE — o que ninguém mostra (o log, o erro, o processo) é o que tem valor"
    - "LEARN IN PUBLIC — o que estudo hoje vira conteúdo aplicado amanhã, com crédito à fonte"
    - "CRÍTICA AO STATUS QUO — 'automação virou promessa vazia' é assinatura, não polêmica gratuita"
    - "IA APLICADA, NÃO IA HYPE — toda menção a IA vem com caso de uso concreto (agente, pipeline, automação)"
  frases_chave_assinatura:
    - "O que a concorrência ainda está planejando, a gente já automatizou"
    - "Prova em movimento, não promessa no papel"
    - "Construído à vista, não prometido no slide"
    - "Olha o log de produção"
    - "O jogo mudou"
  frases_reservadas_para_virals:
    nota: "Bordões institucionais @virals — não usar no perfil pessoal."
    lista:
      - "Skin in the game / Pôr a pele em jogo"
      - "Não somos agência, somos seu departamento de Growth"
  lexico:
    sempre_usar:
      - "founder"
      - "bastidor"
      - "número"
      - "processo"
      - "sistema"
      - "prova"
      - "rodando"
      - "log"
      - "automação"
      - "benchmark"
      - "evidência"
      - "construir"
      - "medir"
    nunca_usar:
      - "empreendedorismo" # cheira a curso de Instagram dos anos 2010
      - "mentoria"         # cheira a guru
      - "dica"             # diminui o conteúdo — usar "lição" ou "leitura"
      - "segredo"          # promessa vazia
      - "sinergia"
      - "alavancar"
      - "holisticamente"
      - "venha" # vendedor de praia — usar "se você quer X, fica"

# ─────────────────────────────────────────────────────────────────────────────
pilares_de_conteudo:
  - id: "backstage-prova"
    nome: "Backstage & Prova em Movimento"
    descricao: >
      Construir à vista: o sistema de automação/IA rodando (ETL monitorando,
      agentes trabalhando, benchmark saindo, criativo nascendo do dado) MAIS o
      humano por trás — decisões, erros, jornada. O log de produção é a prova
      que ninguém consegue fingir. Câmera de celular > estúdio.
    frequencia_alvo: "40%"
    formatos: [reels, stories, carrossel-foto, screen-recording]
  - id: "learnings-aplicados"
    nome: "Learnings Aplicados (learn in public)"
    descricao: >
      O que estudo nos cursos e vídeos de marketing/IA, aplicado NA HORA ao que
      estou construindo. "Estudei X, apliquei aqui no sistema, deu isso." Crédito
      à fonte, número no resultado. Substitui o antigo pilar de cases (que ainda
      não existem) — a lição vem do próprio build, não de cliente.
    frequencia_alvo: "25%"
    formatos: [carrossel-conteudo, reels-explicativo, post-unico]
  - id: "mindset-mitos"
    nome: "Mindset / Quebra de Mitos"
    descricao: >
      Contra-narrativas do nicho de automação/aquisição ("automação não é
      promessa de agência, é log verificável"; "criativo do zero é desperdício
      quando existe benchmark"). Posicionamento por contraste. Gera debate.
    frequencia_alvo: "20%"
    formatos: [carrossel-aspiracional, quote-slide, reels-opiniao]
  - id: "analise-mercado-ia"
    nome: "Análise de Mercado & IA"
    descricao: >
      Leitura de tendências de e-commerce, creators, IA aplicada e atenção —
      usando o PRÓPRIO ETL de monitoramento como antena (dado real do que os
      players do nicho estão fazendo esta semana). Sempre ancorada em sinal real.
    frequencia_alvo: "15%"
    formatos: [carrossel-noticia, reels-comentario, post-unico]


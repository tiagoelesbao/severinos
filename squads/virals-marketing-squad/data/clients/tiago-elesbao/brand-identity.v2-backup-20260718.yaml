oferta_e_conversao:
  modelo: "O sistema é o portfólio — a demonstração converte, não o depoimento"
  funil: "Conteúdo pessoal (topo) → autoridade → Tier 1 benchmark one-shot (porta de entrada barata que GERA o case) → retainer"

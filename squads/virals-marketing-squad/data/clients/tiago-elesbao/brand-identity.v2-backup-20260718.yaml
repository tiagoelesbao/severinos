    - tier: 1
      nome: "Benchmark competitivo one-shot"
      papel: "Porta de entrada / gerador de case rápido. É a ponte de conversão suave do conteúdo."
    - tier: 2
      nome: "Retainer — Radar de tendências + Fábrica de criativos"
      papel: "Motor de receita recorrente."
    - tier: 3
      nome: "Add-on por segmento"

# ─────────────────────────────────────────────────────────────────────────────
# CLIENTES — REGISTRY CANONICAL
# Fonte única de verdade sobre quais clientes/marcas o pipeline `*design-creative`
# está apto a produzir criativos. Cada entrada aponta para os 2 YAMLs de
# identidade (voz/avatar/restrições + paleta/tipografia/logo) e define o
# output_dir-base segregado.
#
# Consumido por:
#   - squads/virals-marketing-squad/scripts/_client_resolver.py
#   - design_creative_protocol (step 0 do @marketing-chief)
# ─────────────────────────────────────────────────────────────────────────────


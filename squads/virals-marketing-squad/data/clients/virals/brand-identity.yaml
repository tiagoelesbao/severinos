oferta:
  posicionamento: "Não somos agência. Somos seu departamento de Growth."
  big_idea: "Creators + Narrativas Virais = Nova Era do E-commerce D2C"
  modelo: "Skin in the game — revenue share de 1%"
  promessa_central: "CAC até 60% menor via creators; crescimento exponencial, não linear."
  manifesto: >
    Toda marca D2C merece as mesmas armas que marcas milionárias têm. Creators
    são o futuro da aquisição, não exceção. Narrativas virais vencem criativos
    genéricos. Crescimento sustentável vem de comunidades apaixonadas — e
    fundadores talentosos merecem dormir 8h, não checar criativos de madrugada.
  pilares_de_entrega:
    - "Hunter Ads System — prospecção, ativação e gestão de creators"
    - "Copy Strategy Framework — roteiros e narrativa viral"
    - "Traffic Performance Protocol — gestão e escala de tráfego"
  produtos:
    - nome: "Viral Starter (Lite)"
      para: "marca saindo do amadorismo digital, validando aquisição"
      escopo: "5-10 micro-creators · 10 roteiros/mês · 1 canal (Meta Ads)"
      investimento: "R$ 6.397-7.997/mês + setup"
      revenue_share: "1% sobre vendas geradas pelos creators"
    - nome: "Viral Growth (Full Stack)"
      para: "marca pronta para escala agressiva (departamento de Growth completo)"
      escopo: "20-50 creators · 40 roteiros/mês · omnichannel · consultoria CMO"
      investimento: "R$ 7.197-8.997/mês + setup"
      revenue_share: "1% sobre as vendas gerais da marca"

# ─────────────────────────────────────────────────────────────────────────────
avatar:
  quem: "Fundadores de marcas D2C / DNVB (Direct-to-Consumer)"
  demografia: "25-45 anos · Brasil (SP, RJ, MG, SC, PR, RS) · 60% masc / 40% fem"
  faturamento: "R$ 30k-2M/mês · sweet spot R$ 50-500k/mês"
  estagio: "Pós-Product-Market-Fit, vendas recorrentes, já roda Meta Ads"
  nichos: [moda, beauty/skincare, fitness/wellness, casa/decor, pet, tech-acessórios, sustentabilidade]
  grande_problema: >
    CAC subindo 10-30% todo mês, dependência total de Meta Ads, criativos que
    queimam em 3-5 dias e nenhum processo estruturado de creators.
  dores:
    - "Não sabe estruturar creators como canal de aquisição escalável"
    - "Não tem tempo nem bandwidth para testar e errar (trabalha 14-16h/dia)"
    - "Medo de investir e ser mais uma promessa vazia sem ROI"
  frustracoes:
    - "Acorda de madrugada checando se os anúncios queimaram"
    - "Trabalha 16h/dia apagando incêndio e sente que não sai do lugar"
    - "Se compara com concorrentes que escalam 'fácil' e não entende como"
  sonho: >
    Marca dominando o nicho com crescimento previsível e sustentável, ecossistema
    de creators promovendo organicamente, margem saudável (40%+) e tranquilidade
    para dormir 8h por noite.
  crencas_erradas:
    - "Investir mais em tráfego pago vai resolver"
    - "Contratar agência tradicional vai resolver"
    - "Fazer curso e aprender sozinho vai resolver"
    - "Contratar gestor de tráfego CLT vai resolver"
    - "Apenas melhorar os criativos vai resolver"


restricoes:
  nunca_fazer:
    - "Promessa vazia — ex.: 'vamos fazer sua marca viralizar'"
    - "Corporativês — ex.: 'utilizamos estratégias omnichannel'"
    - "Genérico — ex.: 'trabalhamos com influenciadores'"
    - "Ego-driven — ex.: 'nosso serviço é o melhor'"
    - "Mistério desnecessário — ex.: 'temos segredos proprietários'"
  sempre_fazer:
    - "Citar dados concretos e específicos (números, prazos, %)"
    - "Falar a língua nativa do D2C"
    - "Nomear os sistemas proprietários (Hunter Ads System etc.)"
    - "Conectar com a dor literal do avatar"


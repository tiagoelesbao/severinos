oferta:
  posicionamento: "Não somos agência. Somos seu departamento de Growth."
  big_idea: "Creators + Narrativas Virais = Nova Era do E-commerce D2C"
  modelo: "Skin in the game — revenue share de 1%"
  promessa_central: "CAC até 60% menor via creators; crescimento exponencial, não linear."
  manifesto: >
    Toda marca D2C merece as mesmas armas que marcas milionárias têm. Creators
    são o futuro da aquisição, não exceção. Narrativas virais vencem criativos
    genéricos. Crescimento sustentável vem de comunidades apaixonadas — e
    fundadores talentosos merecem dormir 8h, não checar criativos de madrugada.
  pilares_de_entrega:
    - "AI UGC & AI Vídeos Ecommerce — produção de vídeo/UGC gerado por IA (substitui o Hunter Ads System, hoje legado)"
    - "Copy AI (Copy Strategy Framework) — roteiros e narrativa viral gerados/curados com IA"
    - "Traffic AI (Traffic Performance Protocol) — gestão e escala de tráfego com apoio de IA"
    - "Dev AI — sites e landing pages de ecommerce construídos com IA"
  pilares_legado:
    - nome: "Hunter Ads System"
      status: "legado — não vendido para novos clientes a partir de 2026-08"
      motivo: "substituído por AI UGC & AI Vídeos: mesmo objetivo (prova social + criativo de aquisição), execução via IA em vez de hunting/gestão manual de creators reais"
  produtos:
    - nome: "Viral Starter (Lite)"
      para: "marca saindo do amadorismo digital, validando aquisição"
      escopo: "AI UGC & AI Vídeos (10-15 criativos/mês) · Copy AI (5 roteiros/semana) · Traffic AI (1 canal, Meta Ads)"
      investimento: "R$ 6.397-7.997/mês + setup"
      revenue_share: "1% sobre vendas geradas pelo motor de criativos"
    - nome: "Viral Growth (Full Stack)"
      para: "marca pronta para escala agressiva (departamento de Growth completo)"
      escopo: "AI UGC & AI Vídeos (40+ criativos/mês) · Copy AI (40+ roteiros/mês) · Traffic AI omnichannel · Dev AI (add-on) · consultoria CMO"
      investimento: "R$ 7.197-8.997/mês + setup"
      revenue_share: "1% sobre as vendas gerais da marca"


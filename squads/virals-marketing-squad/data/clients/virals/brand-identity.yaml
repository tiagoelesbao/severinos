tom_de_voz:
  arquetipo: "Mago (transformação) — acessórios: Criador + Herói"
  dna: "GaryVee Style — a voz educa até doer (Jab, Jab, Jab, Right Hook)"
  personalidade: "Confiante, direto, técnico mas acessível, ousado com pé no chão"
  principios:
    - "Zero Desculpas — não 'o mercado mudou', e sim 'você não se adaptou à atenção'"
    - "Documentar > Criar — linguagem de bastidor, menos estúdio mais realidade"
    - "Nativo ou Nada — a voz se adapta a cada plataforma"
    - "Atenção é a Única Moeda — se o 1º segundo não parou o scroll, falhou"
    - "Confiança baseada em dados concretos, nunca em promessa vazia"
    - "Empatia real com a dor do fundador D2C"
  frases_chave:
    - "CAC 60% menor via creators"
    - "Não somos agência. Somos seu departamento de Growth."
    - "Skin in the game: 1% revenue share"
    - "Creators + Narrativas Virais = Nova Era do D2C"
    - "Crescimento exponencial, não linear"
  lexico:  # vocabulário a SEMPRE usar (substituições obrigatórias)
    alcance: "atenção"
    posts: "micro-content"
    adaptado: "nativo"
    conteudo_de_valor_gratuito: "jab"


avatar:
  quem: >
    Dois perfis convivendo no mesmo público: (1) quem quer aprender e operar IA
    sozinho — consome o cofre gratuito, constrói autoridade própria; (2) donos
    de negócio que querem o RESULTADO de aquisição/conversão pronto, sem tempo
    ou time para operar a IA — viram comprador do serviço via Oraclum.
  demografia: "20-45 anos · Brasil · founders, gestores de marketing/vendas, freelancers e agências que precisam de mais aquisição e conversão com menos operação manual"
  segmentos_em_teste:
    - id: "founders-digitais"
      nome: "Founders de negócios digitais (agências, SaaS, e-commerce)"
      dor: "Gargalo operacional e custo de equipe alto para tráfego, conteúdo, site e atendimento"
      narrativa: "Como automatizar 80% do seu onboarding de clientes ou funil de vendas usando IA."
    - id: "profissionais-corporativos"
      nome: "Profissionais liberais e executivos"
      dor: "Medo de obsolescência profissional perante o avanço rápido da IA"
      narrativa: "Domine as ferramentas de IA que estão redefinindo seu cargo e se torne insubstituível."
    - id: "criadores-conteudo"
      nome: "Criadores de conteúdo e agências de mídia"
      dor: "Dificuldade em manter volume alto de publicações mantendo qualidade"
      narrativa: "A máquina de postagens infinitas: workflow passo-a-passo para produzir 30 vídeos de IA por semana."
    - id: "donos-de-negocio-compradores"
      nome: "Donos de negócio que querem aquisição/conversão pronta (compradores do serviço)"
      dor: "Sabe que precisa de tráfego + criativo + site + CRM funcionando junto, mas não tem tempo, time nem estômago pra montar isso operando ferramenta por ferramenta"
      narrativa: "A gente monta e opera o sistema de aquisição inteiro com IA — você recebe lead qualificado e conversa que já anda sozinha, não uma lista de ferramenta pra aprender."
  dores:
    - "Perda de tempo em tarefas operacionais repetitivas (tráfego, criativo, atendimento)"
    - "Dificuldade de acompanhar as novidades e ferramentas de IA lançadas diariamente"
    - "Ceticismo sobre a utilidade real de IA no dia a dia dos negócios"
    - "Lead chega e morre no funil por falta de automação de atendimento/CRM"
    - "Decisão de mídia no escuro — sem visibilidade real de número e qualidade de lead"
  frustracoes:
    - "Cansado de cursos superficiais de 'como fazer prompts no ChatGPT'"
    - "Falta de exemplos práticos e de código/workflows reais rodando na prática"
    - "Contratou agência que só entrega mídia e nunca resolve o que acontece com o lead depois"
  sonho: >
    Ter um ecossistema de aquisição e conversão de clientes altamente automatizado
    — tráfego, criativo, site e CRM operando com agentes de IA, dado real
    orientando cada decisão — sem precisar montar equipe grande pra sustentar.
  crencas_a_quebrar:
    - "IA é muito complexa de implementar sem saber programar"
    - "IA vai substituir o humano completamente em vez de amplificá-lo"
    - "Automação custa caro ou exige ferramentas inacessíveis"
    - "Agência de tráfego e automação de atendimento são serviços separados — na prática um sem o outro perde lead que já foi pago"


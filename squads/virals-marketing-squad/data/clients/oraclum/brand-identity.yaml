# Portfólio de serviços — ancorado nas 7 categorias reais do cofre
# (apps/captura_ia/src/data/vault). O conteúdo educa E atrai comprador do
# serviço, igual ao padrão já validado em @tiagoelesbao/portfolio_servicos.
#
# 2026-08-15 — submarcas alinhadas ao Painel de Produtos do ClickUp
# (Produto > Gestão de Produtos > Painel de Produtos, campo Empresa):
# Oraclum X, Oraclum AI Gen, Oraclum AI Dev, Oraclum Ops, Oraclum Sales.
# "inteligencia-dados-decisao" foi dobrado dentro de Oraclum Ops (decisão
# de mídia/oferta depende do mesmo dado de CRM+mídia que a automação lê).
portfolio_servicos:
  publico_alvo: "Donos de negócio e gestores que precisam de aquisição e conversão de cliente funcionando de ponta a ponta, sem montar time grande pra operar."
  servicos:
    - id: "trafego-ads-ia"
      submarca: "Oraclum X"
      nome: "Tráfego & Anúncios com IA"
      vault_source: "AI ADS"
      dor_que_resolve: "Criativo de anúncio caro e lento de produzir, decisão de mídia sem visibilidade do que o concorrente está fazendo."
      resultado: "Anúncios em vídeo e UGC produzidos com IA (ex.: Higgsfield, Arcads), inteligência competitiva sobre anúncios de concorrente, conta de anúncios conectada e monitorada."
    - id: "social-conteudo-ia"
      submarca: "Oraclum AI Gen"
      nome: "Social Mídia & Conteúdo com IA"
      vault_source: "AI CONTENT + AUTOMATION (publicação)"
      dor_que_resolve: "Manter volume alto de publicação em várias redes sem contratar equipe de conteúdo inteira."
      resultado: "Equipe de conteúdo com agentes de IA produzindo e publicando automaticamente em múltiplas redes, com texto que não soa 'feito por IA'."
    - id: "sites-lp-ia"
      submarca: "Oraclum AI Dev"
      nome: "Sites & Landing Pages com IA"
      vault_source: "TOOLS AND SKILLS"
      dor_que_resolve: "Site/LP lento de sair do papel, caro, ou com a 'cara genérica de IA' que não converte."
      resultado: "Site publicado rápido com IA, sem o visual clichê — alinhado ao criativo que traz o tráfego."
    - id: "leads-prospeccao-ia"
      submarca: "Oraclum Sales"
      nome: "Geração de Leads & Prospecção com IA"
      vault_source: "LEAD GENERATION"
      dor_que_resolve: "Prospecção manual lenta, lista de lead genérica e sem pesquisa por trás."
      resultado: "Lista de lead raspada por critério real, pesquisa individual por prospect, rascunho de abordagem pronto — humano só aprova e envia."
    - id: "automacao-comercial-crm"
      submarca: "Oraclum Ops"
      nome: "Automação Comercial, CRM & Inteligência de Dados"
      vault_source: "AUTOMATION + AI ADS (competitor intelligence)"
      dor_que_resolve: "Lead que o tráfego já pagou pra gerar morre no atendimento por falta de resposta rápida ou follow-up; decisão de mídia e oferta tomada no escuro."
      resultado: "Pipeline de CRM operado com IA (ex.: GoHighLevel, ManyChat), atendimento e follow-up automatizados, e leitura real do funil (mídia + CRM) para decisão assertiva — o que escalar, o que cortar, onde está o gargalo."


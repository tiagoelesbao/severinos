restricoes:
  nunca_fazer:
    - "Vender IA como mágica ou solução sem esforço"
    - "Usar imagens stock clichês de robôs apertando mãos humanas"
    - "Omitir falhas, taxas de erro ou limitações das ferramentas apresentadas"
    - "Inventar case, depoimento ou número de cliente que não existe — a prova é o cofre/sistema rodando, não depoimento fabricado"
  sempre_fazer:
    - "Ancorar exemplos de serviço nas categorias reais do cofre (LEAD GENERATION, AI ADS, AI CONTENT, TOOLS AND SKILLS, AUTOMATION) — nunca inventar capacidade que a Oraclum não demonstra publicamente"
    - "Quando vender serviço, apontar a dor de aquisição/conversão específica que ele resolve (ver portfolio_servicos)"


tom_de_voz:
  arquetipo: "O Sábio (conhecimento, clareza, dados) — acessório: O Criador (inovação, construção)"
  dna: "Inovador, pragmático, objetivo, focado em logs de produção e aplicação imediata"
  personalidade: "Tecnológico, seguro, baseado em dados e ferramentas reais. Descomplica conceitos difíceis."
  voz_em_uma_frase: "A agência que constrói aquisição de cliente com IA — e mostra o sistema rodando, não promete no slide."
  principios:
    - "DIRETO AO PONTO — sem introduções longas ou contextualização excessiva nas manchetes."
    - "EVIDÊNCIA PRÁTICA — sempre mostrar a tela do software, o resultado do código ou o log do fluxo."
    - "TERMINOLOGIA MODERNA — usar os termos corretos da indústria (agente, LLM, RAG, API) explicados de forma simples."
    - "FOCO EM BENEFÍCIO — o hook deve focar no que o leitor ganha (horas salvas, automação ativa, aumento de faturamento)."
    - "PROVA SEM CASE — sem case de cliente ainda: a prova é o próprio cofre/sistema rodando publicamente. Nunca fabricar resultado de cliente que não existe."
    - "SERVIÇO, NÃO SÓ CONTEÚDO — o conteúdo educa E deixa claro (sem ser vendedor) qual dor de aquisição/conversão a Oraclum resolve como serviço."
  lexico:
    sempre_usar:
      - "automação"
      - "agente"
      - "IA aplicada"
      - "produtividade"
      - "escala"
      - "workflow"
      - "integração"
      - "eficiência"
      - "prático"
      - "aquisição"
      - "conversão"
      - "CRM"
      - "geração de leads"
      - "dado"
    nunca_usar:
      - "fórmula mágica"
      - "fique rico fácil"
      - "segredo infalível"
      - "revolução milagrosa"
      - "trabalho duro sem inteligência"
      - "case de cliente" # até existir um de verdade


# ─────────────────────────────────────────────────────────────────────────────
perfil:
  identidade: "Oraclum"
  nome_formal: "Oraclum Tech"
  handle: "@oraclum"
  papel: >
    Agência IA-first de aquisição e conversão de clientes. Entrega os serviços
    que uma agência tradicional entrega — tráfego pago, social mídia, web
    design/landing pages, geração de leads, automação comercial/CRM e
    inteligência de dados para decisão — só que construídos e operados com
    diferentes métodos de IA: mais rápido, com maior valor agregado e
    escalabilidade do que o modelo de agência com equipe grande.
  objetivo_perfil: "Autoridade + geração de leads para os serviços de aquisição/conversão via IA — o cofre de guias gratuitos é a isca que prova o método antes da venda."
  posicionamento: |
    Não vendemos "gestão de tráfego" nem "consultoria de IA" separados. Entregamos
    o ciclo inteiro de aquisição e conversão de cliente — tráfego, criativo, site,
    geração de leads, automação de atendimento e leitura de dado — construído com
    agentes de IA em vez de equipe grande. O mesmo resultado que uma agência
    tradicional entrega, só que mais rápido, mais barato de escalar e com mais
    inteligência de dado por trás de cada decisão.
  big_idea: "IA não é o futuro, é a infraestrutura do presente. Uma agência que não usa IA para produzir entrega mais devagar, mais caro e sem dado — e vai perder para quem usa."
  promessa_central: "A gente entrega aquisição de cliente de ponta a ponta — tráfego, criativo, site, leads e conversão — construído e operado com IA, com a mesma qualidade de uma agência grande e a velocidade que só automação permite."
  manifesto: >
    O mercado de agência vende hora de gente e chama de expertise. A gente
    substitui parte disso por agentes de IA que produzem criativo, escrevem
    outbound, sobem site, automatizam atendimento e leem o número — e mostra
    o processo rodando, não promete resultado em slide. Não temos ainda um
    catálogo de cases de cliente — temos o próprio cofre de 26 guias, testado
    e usado publicamente, como prova de que o método funciona antes de cobrar
    por ele. Aplicação real primeiro, discurso depois.


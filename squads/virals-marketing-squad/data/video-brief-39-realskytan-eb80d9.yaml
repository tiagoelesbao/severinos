  script: 'Essa é a estrutura perfeita para converter interesse em aquisição com IA
    aplicada. O gancho pronta a atenção inicial. O lead constrói sobre esse interesse,
    dando contexto necessário. No body, ofereço o máximo de valor, seja produtividade
    ou dados reais, sempre com evidência prática na tela do software. Se eu só jogar
    informação, ninguém acompanha. O open loop cria expectativa: o que vem a seguir
    com o agente integrado? No segundo body, aprofundo a integração agente e CRM,
    prometendo escala real na geração de leads. Outro open loop reforça a promessa
    de conversão contínua. Aqui entra o yet, mas, portanto: essas conexões mantêm
    o ritmo, conectando os corpos sem perda de retenção. No terceiro body, mostro
    o workflow rodando na prática, a integração efetiva, o dado fluindo entre os sistemas,
    apenas automação aplicada. Pense na sua própria estrutura de aquisição: onde um
    open loop poderia aumentar as taxas de conversão? Essa é a estrutura perfeita.
    Teste no seu sistema e veja a diferença que a automação faz na conversão.'
  edit_spec:

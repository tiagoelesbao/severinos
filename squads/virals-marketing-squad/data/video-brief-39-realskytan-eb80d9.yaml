  caption: 'Hey what’s up 🙋 I''m Sky and 3 years ago I got OBSESSED with 1 question:


    What makes some reels get 200 views and some reels 2,000,000 views?


    And I tried everything under the sun 😩

    - Posting at peak times

    - Stealing viral hooks

    - Spamming hashtags

    - 🤐and maybe a dance here and there

    Literally everything…


    And over the last 3 years I learned none of that mattered 😂But I DID learn the
    #1 factor to a 🏆Winning Personal Brand, after:

    - Over 8,000 videos for your favourite experts (DAMN that’s a lot)

    - 1 billion views

    - 1m followers

    - and 7 figures in revenue


    The WINNING formula is….. good Topics + viral Formats + disciplined Testing


    So I changed everything in my business to optimize for this


    And today I run ClipCut now, a Done-For-You Content team behind your favorite
    experts (think dog trainers, finance coaches) where we… strategize, research,
    script, sometimes film ✈️, edit, post, track and adapt content to win


    But a billion views later…. I’m still the same person, scrolling reels at 2am,
    trying to figure out why a specific hook was so freakin’ good . 😂 Send help. 😁


    But we’re just getting started


    I post about winning tactics and strategies I and the best creators use


    Comment "CONTENT" on any of my reels to 1) get my best free sauce OR 2) see how
    we can work together


    If that''s your thing, follow me 🤝'

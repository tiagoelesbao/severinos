  script: 'Como você deixou esse lead escapar? Não, senhor. Eles eram muitos para
    um processo sem agente. Temos que nos prevenir, o volume de dados é alto e não
    sabemos o que o concorrente será capaz de fazer com uma IA aplicada. Não podemos
    mandar esses leads para um workflow manual, ele pode ter armado um gargalo no
    seu CRM. Este é o único jeito: temos que arriscar a automação inteligente. Não
    podemos ficar parados vendo a conversão cair. Por que será que o seu sistema de
    aquisição parou de responder agora? É estranho, né? Se algo está por vir na sua
    operação, você precisa se preparar. Eu já venho notando isso há um tempo: processos
    que não escalam. E se o seu agente não estiver rodando, o lead vai morrer. O sistema
    aqui? Esse é o workflow real.'

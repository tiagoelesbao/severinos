  caption: 'I’ve always had an aversion to people saying “I want to build an empire”
    mostly because it’s…


    Delusional - and - empires all have one thing in common - they end.


    So I’ve always preferred utility as the goal. Be useful. Help. Maximize that.
    And you’ll get whatever you want. And, like everything, the people you help and
    the things you do will disappear. But that’s okay. While you were here, you came
    and served.


    And I see that as a life well lived. “Empire” or not.'

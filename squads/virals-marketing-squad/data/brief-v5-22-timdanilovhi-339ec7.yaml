  - O Slide 2 e o Slide 1 repetem a informação da mudança, embora o 2 seja mais detalhado;
    o Slide 9 é lixo de conteúdo.
  fatores_de_performance:
  - 'Uso de News-jacking: aproveita uma mudança de regra real para gerar urgência
    imediata.'
  - 'Reframe Psicológico: transforma uma notícia negativa (exigência maior) em um
    incentivo positivo (corra antes que mude).'
  - 'Listicle de baixo atrito: entrega nichos prontos, reduzindo o esforço cognitivo
    de quem consome.'
  - 'CTA de alto engajamento: o uso de palavra-chave no comentário (''NICHE'') para
    automação de Direct/Lead Gen.'

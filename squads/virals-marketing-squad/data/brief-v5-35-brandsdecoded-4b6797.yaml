benchmark_analysis:
  tema_central: A transição da busca por alcance (atenção) para a construção de autoridade
    real através de conteúdos densos e estratégicos (convencimento).
  formato: Carrossel Educativo de Estratégia de Conteúdo (Framework/Methodology)
  arco_narrativo: O post inicia com uma quebra de expectativa (desconstruindo a necessidade
    de vídeos diários), identifica um problema de mercado (confusão entre alcance
    e reputação), apresenta uma solução teórica (carrosséis para convencimento vs.
    vídeos para atenção) e finaliza com a entrega prática (3 modelos de aplicação)
    e um CTA de autoridade.
  estrutura:
  - slide_n: 1
    papel: 'Gancho/Hook: Desafio de crença estabelecida para gerar curiosidade.'
    essencial: true
  - slide_n: 2
    papel: 'Problematização: Diferenciação entre métricas de vaidade e métricas de
      negócio.'
    essencial: true
  - slide_n: 3
    papel: 'Fundamentação/Tese: Defesa do formato carrossel como ferramenta de profundidade.'
    essencial: true
  - slide_n: 4
    papel: 'Conceito Chave: O contraste binário entre Atenção vs. Intenção.'
    essencial: true
  - slide_n: 5
    papel: 'Transição/Promessa: Identificação da barreira de execução e anúncio do
      método.'
    essencial: true
  - slide_n: 6
    papel: 'Entrega Prática 01: Aplicação de tendência no nicho.'
    essencial: true
  - slide_n: 7
    papel: 'Entrega Prática 02: Diagnóstico de dor para solução.'
    essencial: true
  - slide_n: 8
    papel: 'Entrega Prática 03: Estudo de caso/Mecanismo via terceiros.'
    essencial: true
  - slide_n: 9
    papel: Vazio/Erro de exportação.
    essencial: false
  - slide_n: 10
    papel: 'Conclusão e CTA: Mudança de mindset (processo > criatividade) e conversão.'
    essencial: true
  redundancias:
  - Slide 9 está vazio/inexistente.
  - Slide 3 e Slide 4 poderiam ser fundidos para acelerar a entrega da tese central.
  fatores_de_performance:
  - Contraste de conceitos (Atenção vs. Convencimento) que gera 'aha moment'.
  - Uso de frameworks acionáveis (Modelo 01, 02, 03) que aumentam o salvamento.
  - Autoridade por meio de diferenciação intelectual (não é sobre postar, é sobre
    estratégia).
  - Estrutura de 'Problem-Agitation-Solution' (PAS) muito bem definida.
  recomendacao:
    slides_ideais: 7
    justativa: Para o padrão Virals, a densidade deve ser maior e o tempo de leitura
      menor. Fundiríamos o Slide 3 e 4 em um único slide de 'Tese' e removeríamos

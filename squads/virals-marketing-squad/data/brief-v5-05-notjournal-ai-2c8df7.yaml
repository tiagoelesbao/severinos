benchmark_caption: 'A JBS, maior empresa de proteína animal do mundo em receita, deve
  anunciar nesta segunda-feira (10) a troca de seu CEO global. Wesley Batista Filho
  assumirá o cargo atualmente ocupado por Gilberto Tomazoni, segundo O Globo.


  Tomazoni está à frente da JBS como CEO global desde dezembro de 2018. Antes de chegar
  ao comando, passou 27 anos na Sadia e também foi vice-presidente da Bunge Alimentos.


  Aos 34 anos, Wesley Batista Filho está na JBS desde 2011. Ele começou como estagiário
  em uma unidade de produção no Colorado, nos Estados Unidos, e passou por diferentes
  áreas e países.


  Em 2014, tornou-se presidente da JBS Canadá. Depois, comandou a divisão de bovinos
  da JBS USA, foi CEO da JBS Brasil e, em 2020, assumiu também a presidência da Seara.


  Em 2022, Wesley Filho passou a comandar as operações globais da companhia. No ano
  seguinte, retornou aos Estados Unidos para assumir o cargo de CEO da JBS USA, posição
  que ocupa atualmente.


  A JBS USA é a maior plataforma da companhia em receita e reúne mais de 60 unidades
  de produção de carne bovina, suína, aves e alimentos preparados em 31 estados americanos.


  Em 2025, a JBS registrou receita líquida de US$ 86,2 bilhões e lucro líquido de
  US$ 2,2 bilhões. A companhia vende seus produtos em cerca de 197 países.


  A mudança coloca Wesley Filho no comando global de uma empresa que passou a ter
  suas ações negociadas na Bolsa de Nova York em 2025. O anúncio oficial da sucessão
  deve ser feito ainda nesta segunda-feira.


  Siga o @notjournal.ai'

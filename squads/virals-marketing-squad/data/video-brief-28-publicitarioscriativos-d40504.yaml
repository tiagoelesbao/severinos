  caption: 'A luminária Luxo Jr. é a mascote oficial da Pixar, aparecendo na abertura
    de cada filme do estúdio e virando um dos símbolos mais reconhecíveis da animação
    mundial. Agora ela ganha vida também fora das telas.


    O lançamento foi apresentado pela Disney durante a D23 e integra uma coleção de
    colecionáveis dedicada aos 40 anos do estúdio. O item reproduz a estética clássica
    do personagem, mas incorpora sensor de movimento, sons e respostas programadas,
    funcionando como objeto interativo em vez de fonte real de iluminação.


    A escolha reforça como o mercado de merchandising aposta em mascotes históricos
    para transformar nostalgia em produto premium.'

# ─────────────────────────────────────────────────────────────────────────────
# STACK DE GERAÇÃO LOCAL — ComfyUI do founder
#
# Consumido por: @image-lead (`stills`), @motion-lead (`takes`),
#                @sound-designer (`audio`), @exec-producer (`assign`, `budget`)
#
# POR QUE ISTO EXISTE
# O `model-routing.yaml` responde "qual ferramenta usar". Este arquivo responde
# "o que roda NA MÁQUINA, com qual licença, em quanta VRAM, e onde o arquivo mora".
# É o inventário da capacidade instalada — não de intenção.
#
# REGRA DE OURO (_BLUEPRINT.md §3.1): quem gera é humano. Este arquivo descreve o
# motor que o operador opera, não uma chamada automática.
# ─────────────────────────────────────────────────────────────────────────────


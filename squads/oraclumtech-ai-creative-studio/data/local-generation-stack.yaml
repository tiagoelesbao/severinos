# INSTALADO E VALIDADO — roda hoje
# ─────────────────────────────────────────────────────────────────────────────
instalado:
  video_i2v:
    - id: wan22-i2v-a14b
      nome: 'Wan 2.2 I2V A14B (GGUF Q4_K_M, dual-stage)'
      arquivos:
        - { file: 'Wan2.2-I2V-A14B-HighNoise-Q4_K_M.gguf', pasta: 'models/unet', tamanho: '9.0G' }
        - { file: 'Wan2.2-I2V-A14B-LowNoise-Q4_K_M.gguf', pasta: 'models/unet', tamanho: '9.0G' }
      encoder: { file: 'umt5-xxl-encoder-Q8_0.gguf', pasta: 'models/text_encoders', tamanho: '5.7G' }
      vae: { file: 'wan_2.1_vae.safetensors', pasta: 'models/vae', tamanho: '243M' }
      status: validado
      evidencia: 'lote "vovós" renderizado com 6 takes — frames/render_jobs.json'
      nota_de_vae: >
        Usa o VAE 2.1, não o 2.2. Está correto: o wan2.2_vae é do modelo TI2V 5B,
        não do A14B. Trocar quebra.

    - id: lightx2v-4step
      nome: 'LoRAs de destilação lightx2v 4-step (high + low noise)'
      arquivos:
        - { file: 'wan2.2_i2v_A14b_high_noise_lora_rank64_lightx2v_4step_1022.safetensors', pasta: 'models/loras', tamanho: '606M' }
        - { file: 'wan2.2_i2v_A14b_low_noise_lora_rank64_lightx2v_4step_1022.safetensors', pasta: 'models/loras', tamanho: '706M' }
      status: 'instalado, DELIBERADAMENTE fora do fluxo principal'
      decisao_do_founder: >
        Testadas e REMOVIDAS: derrubavam a qualidade do output. Não é esquecimento —
        é decisão validada em produção. O fluxo de entrega roda sem LoRA, 20 steps
        a cfg 4, e é assim que deve continuar.
      onde_sobrevivem: 'assets/comfyui/workflows/wan22-i2v-fast.json — só previz'
      para_que_servem_entao: >
        Decidir SE um take funciona (composição, enquadramento, se o movimento pega)
        antes de gastar 5x o tempo no render de verdade. É triagem, não entrega.
      armadilha: 'cfg DEVE cair para 1.0 quando elas entram. LoRA de destilação com cfg alto queima a imagem.'

  imagem_t2i:
    - id: flux2-klein-4b
      nome: 'FLUX.2 [klein] 4B (GGUF Q8_0)'
      licenca: 'Apache 2.0 — uso comercial liberado, sem asterisco'
      arquivos:
        - { file: 'flux-2-klein-4b-Q8_0.gguf', pasta: 'models/unet', tamanho: '4,00 GiB (4.300.644.928 bytes)' }
      encoder: { file: 'qwen_3_4b.safetensors', pasta: 'models/text_encoders', tamanho: '7,49 GiB (8.044.982.048 bytes)' }
      vae: { file: 'flux2-vae.safetensors', pasta: 'models/vae', tamanho: '321 MiB (336.211.292 bytes)' }
      total_em_disco: '11,81 GiB'
      status: instalado
      ja_conferido:
        - 'Tamanho dos 3 arquivos idêntico ao manifesto do HuggingFace, byte a byte'
        - 'Header do GGUF lido: magic GGUF v3, general.architecture=flux, file_type=7 (Q8_0), 149 tensores'
        - 'Grafo conferido contra o /object_info da instalação real: as 12 classes de nó existem, e todo input, widget e saída bate com o schema'
        - 'Os 3 arquivos aparecem nos dropdowns dos loaders — prova que a pasta está certa'
        - 'CLIPLoader aceita type=flux2 nesta versão (ComfyUI 0.33.1)'
      o_que_falta_para_validar: >
        GERAR IMAGEM e ela ser aproveitada em job real. Nenhum pixel saiu ainda — o
        grafo foi conferido, não executado. Enquanto isso não acontece, é capacidade
        instalada, não capacidade provada.
      por_que_nao_rodou_ainda: >
        No momento da instalação a máquina estava com 2,3 GB de RAM livres de 16 GB
        (ComfyUI já no ar com outra sessão). O encoder sozinho pede 7,49 GiB. Rodar ali
        seria atropelar a sessão em curso e medir errado. Fica para a janela de render
        noturno, que é o modo de operação padrão desta casa.
      procedencia:
        modelo: 'unsloth/FLUX.2-klein-4B-GGUF (base_model: black-forest-labs/FLUX.2-klein-4B)'
        encoder_e_vae: 'Comfy-Org/vae-text-encorder-for-flux-klein-4b'
        conferido: 'Repo e arquivo verificados via API do HuggingFace antes do download — não é URL adivinhada.'
      por_que_o_4B_e_nao_o_9B: >
        ARMADILHA DE LICENÇA. Existe FLUX.2 [klein] 9B e ele é melhor. Mas só o 4B saiu
        sob Apache 2.0 — o 9B é NON-COMMERCIAL, mesma cilada do flux1-dev/flux1-krea-dev
        já registrada em `rejeitados`. Canal monetizado torna licença critério técnico.
        Quem for buscar GGUF vai esbarrar primeiro nos repos 9B: não são utilizáveis aqui.
      por_que_q8_0: >
        Corrigindo a estimativa antiga deste arquivo ("~2.6 GB em Q4_K_M"): Q4_K_M existe
        e tem 2,43 GiB, mas é a escolha errada para esta casa. O klein é DISTILLED — a
        alavanca de qualidade não é step count, é quantização. Q8_0 (4,00 GiB) é
        praticamente sem perda contra o BF16 (7,22 GiB) e ainda deixa ~4 GB de VRAM
        livres para o VAE decode. Cabe, então leva o Q8_0.
      config_de_execucao: >
        4 steps, cfg 1.0, sampler euler, sigmas pelo Flux2Scheduler. NÃO usa o nó
        FluxGuidance: o transformer/config.json do klein-4B traz `guidance_embeds: false`.
        O modelo não tem embed de guidance — o nó seria decoração.
      armadilha_de_ram: >
        O gargalo aqui é RAM, não VRAM. O encoder bf16 tem 7,49 GiB numa máquina de 16 GB;
        o pico é no encode. Se estourar, o fallback é `qwen_3_4b_fp4_flux2.safetensors`
        (3,58 GiB, mesmo repo Comfy-Org) — custa aderência ao prompt, então é saída de
        emergência, não padrão. Não foi baixado para não gastar disco por antecipação.
      workflow: 'assets/comfyui/workflows/flux2-klein-t2i.json'
      nota_de_transicao: >
        MANTIDA da versão anterior e ainda vale: o founder já aprova o look do Krea.
        Trocar por modelo local muda a estética. Rodar os dois em paralelo por um lote
        antes de migrar de vez, e registrar a comparação — não migrar às cegas.
      ainda_nao_instalados:
        - { id: z-image-turbo, licenca: 'Apache 2.0', quando: 'iterar rápido — quando o gargalo é número de tentativas, não qualidade absoluta', status: a_validar_no_estudio }
        - { id: qwen-image, licenca: 'Apache 2.0', quando: 'TEXTO dentro da imagem (cartela, thumb) — melhor renderização de texto entre os abertos', status: a_validar_no_estudio }

  # ═══ ÁUDIO GENERATIVO — instalado em 2026-08-29 ═══════════════════════════
  # Fecha a lacuna de TRILHA (era P4) e o braço "banco de SFX" da P3.
  # Os dois têm suporte NATIVO no ComfyUI — nenhum custom node.
  audio_musica_e_sfx:
    - id: stable-audio-open-1.0
      nome: 'Stable Audio Open 1.0'
      papel: 'trilha de APOIO e banco de SFX — o áudio que sustenta a peça, não o que é a peça'
      licenca: 'Stability AI Community License'
      licenca_detalhe: >
        ATENÇÃO — é a ÚNICA peça do stack local cuja licença depende do FATURAMENTO, não
        do uso. Comercial liberado abaixo de USD 1 milhão de receita anual, exigindo
        registro em stability.ai/community-license e atribuição "Powered by Stability AI"
        visível. Acima disso a licença TERMINA e passa a exigir acordo enterprise.
        Não é Apache 2.0. Revisar na virada de cada ano fiscal — é o único item do stack
        que pode deixar de ser utilizável sem que ninguém mexa em nada.
      arquivos:
        - { file: 'stable-audio-open-1.0.safetensors', pasta: 'models/checkpoints', tamanho: '4,521 GiB (4.853.889.016 bytes)' }
      encoder: { file: 't5-base.safetensors', pasta: 'models/text_encoders', tamanho: '0,830 GiB (891.646.390 bytes)' }
      total_em_disco: '5,351 GiB'
      teto_de_duracao: '47 segundos — limite do embedder de duração do modelo, não escolha nossa'
      status: instalado
      procedencia:
        checkpoint: 'Comfy-Org/stable-audio-open-1.0_repackaged (base: stabilityai/stable-audio-open-1.0)'
        encoder: 'ComfyUI-Wiki/t5-base (Apache 2.0)'
        conferido: >
          Repos e arquivos verificados via API do HuggingFace antes do download — não é URL
          adivinhada. As duas URLs vieram do próprio pacote comfyui-workflow-templates
          0.11.41 instalado na máquina (template audio_stable_audio_example.json), que é a
          fonte oficial e evita o palpite.
        armadilha_do_repo: >
          O repo original `stabilityai/stable-audio-open-1.0` é GATED — exige aceite de
          licença e token. Quem tentar baixar direto dele por script vai tomar 401 e achar
          que é problema de rede. O repackaged do Comfy-Org é aberto e é o que os templates
          oficiais apontam.
      ja_conferido:
        - 'Tamanho dos 2 arquivos idêntico ao manifesto do HuggingFace, byte a byte'
        - 'Header safetensors lido: 745 tensores no checkpoint, 258 no encoder'
        - 'Os 2 arquivos aparecem no folder_paths.get_filename_list() do ComfyUI — prova de pasta certa'
        - 'As 8 classes de nó do grafo existem no /object_info real (930 nós) — suporte NATIVO confirmado'
        - 'Grafo validado: zero links quebrados, inputs/widgets batem com o schema'
        - 'Conversão UI→API do smoke test testada a seco: zero input faltando ou sobrando'
      por_que_precisa_de_encoder_separado: >
        O checkpoint NÃO carrega o text encoder. O header safetensors mostra 745 tensores e
        apenas os conditioners de `seconds_start`/`seconds_total` — nenhum T5. Por isso o
        t5-base.safetensors vai separado em models/text_encoders e entra pelo CLIPLoader
        nativo com type=stable_audio. A saída CLIP do CheckpointLoaderSimple fica sem uso,
        e isso é correto, não esquecimento. É o oposto do ACE-Step, que é all-in-one.
      config_de_execucao: >
        50 steps, cfg 4.98, sampler dpmpp_3m_sde_gpu, scheduler exponential. Valores do
        template oficial. Este modelo NÃO é destilado — aqui step count É a alavanca de
        qualidade, ao contrário do FLUX klein, onde a alavanca era quantização. A regra da
        casa (qualidade máxima aceitando lentidão) empurra para steps altos.
      workflow: 'assets/comfyui/workflows/audio-trilha-sfx.json'
      o_que_falta_para_validar: 'Gerar leito/SFX e ele ser aproveitado em job real'

    - id: ace-step-v1-3.5b
      nome: 'ACE-Step v1 3.5B (all-in-one)'
      papel: 'música COMPLETA com letra e vocal — o substituto local do Suno'
      licenca: 'Apache 2.0 — uso comercial liberado, sem asterisco e sem teto de faturamento'
      arquivos:
        - { file: 'ace_step_v1_3.5b.safetensors', pasta: 'models/checkpoints', tamanho: '7,171 GiB (7.699.743.341 bytes)' }
      encoder: 'EMBUTIDO no checkpoint (text_encoders.umt5base) — não precisa de arquivo separado'
      total_em_disco: '7,171 GiB'
      status: instalado
      procedencia:
        modelo: 'Comfy-Org/ACE-Step_ComfyUI_repackaged — all_in_one/ace_step_v1_3.5b.safetensors'
        conferido: 'Repo aberto (não-gated), licença Apache 2.0 confirmada via API do HuggingFace. URL vinda do template oficial audio_ace_step_1_t2a_song.json.'
      ja_conferido:
        - 'Tamanho idêntico ao manifesto do HuggingFace, byte a byte'
        - 'Header safetensors: 1903 tensores, incluindo text_encoders.umt5base — all-in-one confirmado'
        - 'Aparece no folder_paths.get_filename_list("checkpoints")'
        - 'As 10 classes de nó do grafo existem no /object_info real — suporte NATIVO confirmado'
        - 'Grafo validado: zero links quebrados, inputs/widgets batem com o schema'
      os_dois_campos_sao_o_recurso: >
        `tags` e `lyrics` são entradas SEPARADAS do nó TextEncodeAceStepAudio, e essa
        separação é o recurso principal do modelo — é exatamente o fluxo de dois artefatos
        que a aula 3 ensinou. Estilo curto (~200 caracteres) num campo, letra de verdade no
        outro, com marcadores estruturais entre colchetes ([verse], [chorus], [instrumental]).
        Misturar os dois campos quebra o modelo. Não é campo livre único.
      config_de_execucao: >
        50 steps, cfg 5.0, euler, scheduler simple, shift 5.0 no ModelSamplingSD3, tonemap
        Reinhard 1.0, lyrics_strength 0.99. Todos do template oficial, sem alteração.
      o_que_a_licenca_local_NAO_resolve: >
        Apache 2.0 + geração local elimina a PRIMEIRA das quatro ressalvas da aula 3 — a
        titularidade deixa de depender dos termos de uso de uma plataforma, porque não há
        plataforma entre o founder e o arquivo. As outras TRÊS continuam de pé e nenhum
        modelo resolve: proteção contestada de obra puramente gerada, possibilidade de
        reivindicação de Content ID por semelhança, e política própria de distribuidora
        sobre IA. Instalar o modelo não é resolver o direito.
      workflow: 'assets/comfyui/workflows/audio-musica-acestep.json'
      o_que_falta_para_validar: 'Gerar faixa e ela ser aproveitada num loop real'

  audio_nota_de_teste: >
    NENHUMA amostra de áudio foi gerada na instalação. No momento havia 5,68 GiB de RAM
      livre e o Stable Audio Open sozinho pede ~5,7 GiB só para carregar checkpoint +
      encoder antes de subir para a placa — abaixo do piso de 6 GiB que a própria tarefa
      fixou. O ComfyUI, que estava no ar, caiu durante os downloads. Ficou pronto o script
      `assets/comfyui/smoke-test-audio.py`, que aborta sozinho abaixo de 6 GiB, confere as
      travas de numpy/torch e gera as duas amostras na janela de render noturno.

  interpolacao_e_upscale:

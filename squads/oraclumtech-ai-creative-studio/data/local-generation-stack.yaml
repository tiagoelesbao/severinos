# ─────────────────────────────────────────────────────────────────────────────
hardware:
  gpu: 'NVIDIA RTX 4060 Ti'
  vram_gb: 8
  ram_gb: 16
  disco_livre_gb: 19   # medido em 2026-08-29 após instalar o stack de áudio
  nota_de_disco: >
    O valor acima oscila: durante a instalação do FLUX.2 o livre caiu de 49 GB para
    31 GB, mas o stack de imagem responde por 11,81 GiB disso — o resto foi sessão
    concorrente e pagefile. Ao orçar espaço, contar o tamanho dos arquivos, não o delta
    do `df`. O stack de ÁUDIO (2026-08-29) foi a exceção que confirma a regra: 31,61 →
    19,09 GiB livres, delta de 12,52 GiB, batendo ao byte com a soma dos três arquivos
    — porque desta vez a máquina estava sem sessão concorrente de render.
  alerta_de_disco: >
    19 GiB livres é o ponto mais apertado que este setup já esteve. Com imagem + vídeo +
    TTS + áudio instalados, o disco deixou de ser "o limite mais apertado" para ser o
    limite ATIVO. Instalar qualquer modelo novo (InfiniteTalk, Qwen-Image-Edit,
    HunyuanVideo-Foley) exige decidir ANTES o que sai. Não há mais folga para instalar
    por curiosidade.
  modo_de_operacao:
    padrao: 'render noturno — máquina livre, nenhuma tela aberta, sem uso concorrente'
    tolerancia_a_lentidao: 'ALTA — decisão explícita do founder'
    evidencia: 'roda Wan 2.2 A14B a 20 steps + RIFE + upscale 4x sem estourar'
    declaracao_do_founder_2026_08_29: >
      "demora na geração pra mim não é problema, prefiro que demore mas eu tenha
      sempre os resultados de maior qualidade possível"
    consequencia_na_escolha_de_modelo: >
      REGRA DE DESEMPATE PERMANENTE. Entre dois modelos, vence o de maior qualidade
      mesmo que seja várias vezes mais lento. Modelo "turbo", "fast", "distilled" ou
      "lightning" só entra como PREVIZ — nunca como padrão de entrega. Isto já
      decidiu: as LoRAs lightx2v ficaram fora do fluxo principal do Wan, e o Q8_0
      venceu o Q4_K_M no FLUX. Aplicar o mesmo critério a toda avaliação futura.
  nota_de_cu126: >
    O ComfyUI avisa no boot: "You need pytorch with cu130 or higher to use optimized
    CUDA operations". O torch aqui é 2.13.0+cu126, então esse caminho otimizado está
    DESLIGADO — vale para todo modelo, não só os novos. Não é defeito e não deve ser
    mexido por conta própria: subir para cu130 arrasta o ambiente inteiro (numpy,
    TTS-Audio-Suite) e é decisão do founder, não efeito colateral de instalação.
  a_regra_que_manda: >
    CORRIGIDO em 2026-08-28. A leitura anterior ("8 GB é o teto que decide tudo")
    estava mal calibrada. Com offload e render noturno, o setup engole modelo pesado
    — o próprio Wan A14B em dois estágios é prova. A regra real é:
    OTIMIZAR POR QUALIDADE MÁXIMA, aceitando lentidão. Quantização alta vence
    quantização baixa mesmo custando horas; o gargalo é a noite, e a noite é longa.
  o_que_ainda_e_limite:
    - 'Modelo que não cabe nem com offload (ex.: pede 24 GB residentes)'
    - 'DISCO — 36 GB livres (2026-08-28). É o limite mais apertado hoje, não a VRAM.'
    - >
      RAM 16 GB — descoberto ao instalar o FLUX.2 klein. Text encoder grande roda na
      CPU antes de subir para a placa: o encoder bf16 do klein tem 7,49 GiB e o pico
      é no encode. Quantização do UNet resolve VRAM e não resolve isto. Ao avaliar
      modelo novo, olhar o tamanho do ENCODER, não só o do UNet.
  consequencia_de_orcamento: >
    O recurso escasso NÃO é crédito de API, nem VRAM — é DISCO e noite de máquina.
    O `*budget` do exec-producer conta GB e noites, não dólar.


  # ───────────────────────────────────────────────────────────────────────────
  - asset: voz_vo
    descricao: 'Locução, narração, fala de personagem'
    usado_em: [P1, P2, P3, P4, P5]
    preferido:
      ferramenta: 'Gravação humana real'
      status: decisao_arquitetural
      por_que: >
        Não existe NENHUM gerador de voz no repositório — verificado por varredura em
        todo o monorepo (edge-tts, elevenlabs, piper, gTTS, text-to-speech: zero
        ocorrências). O que existe é o caminho inverso: Whisper local transcrevendo
        áudio com timestamp por palavra (_speech.js). Ou seja, a infra sabe LER voz,
        não produzir. Enquanto isso for verdade, VO é gravação.
      tecnica:
        - 'O sound-designer entrega direção de leitura: ritmo, ênfase, onde respirar, onde acelerar'
        - 'Grave em ambiente tratado; ruído de fundo é o que denuncia produção amadora'
        - 'Grave 2 takes da mesma leitura — o segundo quase sempre tem melhor ritmo'
        - 'Em dark-room, a voz é a assinatura do canal: trocar de locutor entre episódios reseta o reconhecimento'
      armadilhas:
        - 'Leitura com ritmo constante soa robótica mesmo sendo humana — a direção precisa marcar variação'
        - 'Primeira frase sem energia derruba a retenção inteira'
    alternativa:
      ferramenta: 'Ferramenta web de síntese de voz'
      status: a_validar
      quando_preferir: 'Volume alto de episódios de canal, se a qualidade for aprovada em teste'
      obrigacao_antes_de_usar:
        - 'Testar e registrar o resultado — nenhuma ferramenta de voz está validada neste repositório'
        - 'Aprovação explícita do founder para peça da própria Oraclum: voz sintética não declarada contradiz o discurso de transparência da marca'
    local:
      situacao: 'MUDOU DESDE A ESCRITA DESTE ARQUIVO — a rota local existe, rodou e tem voz canônica decidida'
      supera_o_que: >
        A afirmação do bloco `preferido` acima ("não existe NENHUM gerador de voz no
        repositório, portanto VO é gravação") era verdadeira em 2026-08-21 e não é mais.
        Ela fica registrada porque explica por que o desenho é como é — mas a rota de
        narração de canal hoje é local. Gravação humana continua sendo a rota certa para
        peça de cliente com locutor próprio e para qualquer peça em que a voz É o rosto.
      engine_padrao:
        nome: 'ChatterBox Official 23-Lang v3 (TTS-Audio-Suite), `language=Portuguese`'
        licenca: 'MIT — sem asterisco, contra canal monetizado'
        status: validado
        evidencia: 'docs/NARRACAO-LOCAL.md §3 — WER 0,0% medido por retranscrição com Whisper'
        por_que_ganhou: >
          PT-BR nativo (uma das 23 línguas, não adaptação) e cross-lingual: aceita voz de
          referência em inglês e fala português correto com o timbre dela. Ritmo mais
          narrativo (7,86 s contra 5,68 s da F5 na mesma frase).
      voz_canonica_do_canal:
        decisao: 'VOZ EMBUTIDA da ChatterBox 23L, SEM clonagem — decisão do founder, 2026-08-29'
        amostra: 'assets/comfyui/samples/04-chatterbox23L-pt-voz-embutida.mp3'
        como_ativar: '`narrator_voice = none` e NÃO conectar `opt_narrator`'
        por_que: 'WER 0,0%; sem titular de voz a autorizar; reprodutível episódio após episódio sem depender de um .wav sobreviver a backup; licença MIT'
        regra_operacional: >
          Episódio de P5/P7 usa esta voz por padrão. Clonagem só entra quando o job PEDIR
          uma voz específica (cliente com locutor próprio, personagem), e aí passa pelo
          `fact-checker` em `*rights` ANTES de gerar.
      engine_alternativo:
        nome: 'F5-TTS PT-BR'
        quando: 'Quando velocidade importa mais que qualidade — ~9x mais rápida depois de aquecida (5 s contra 45 s nos mesmos 3 cues). Tem `speed` nativo, que a ChatterBox não tem.'
        obrigacao: 'SEMPRE com referência em português e o texto exato da referência. Com referência inglesa ela desmonta (WER 36,8%).'
      workflow: 'assets/comfyui/workflows/tts-narracao-srt.json'
      o_recurso_que_decide: >
        `Adjusted_SRT` — o timing REAL do áudio gerado, não o estimado do roteiro. É o que
        permite entregar a timeline pré-montada com legenda sincronizada e slots vazios
        esperando os takes. Sem ele, alguém sincroniza legenda na mão, todo dia.
      timing_mode: 'smart_natural é o padrão. `stretch_to_fit` é PROIBIDO em narração longa: elevou o WER de 0,0% para 15,8% e, pior, reporta no Adjusted_SRT a duração PRÉ-esticamento.'
      o_srt_e_uma_partitura: >
        Como a entrada é SRT e não texto corrido, o intervalo entre cues vira duração de
        pausa, a razão duração/palavras vira velocidade do trecho, a fronteira do cue vira
        ponto de respiração e a tag vira intensidade. Ver `data/oratoria-e-prosodia.yaml` —
        é o que separa "voz que lê" de "voz que conduz".
      armadilhas_medidas:
        - 'Trocar ENGINE A → B na mesma sessão QUEBRA a F5 (tensor em device errado) e ela reporta `success` gravando ~1 s de áudio morto. B → A funciona. Não alterne engine dentro de um lote.'
        - 'O cache de áudio pode devolver segmento válido com o modelo em estado inválido. Ao investigar falha de engine, desligue o cache ou mude o seed.'
        - 'Evite cue de SRT com duas ou três palavras soltas — junte no cue vizinho.'
        - 'Uma instância só de ComfyUI: a segunda morre na porta 8188 e você fica falando com a velha.'
      ainda_nao_medido: 'Roteiro de 7 minutos inteiro. Os testes foram com 3 cues (11 s). Extrapolando, 30–40 min de GPU — é render noturno, mas precisa ser medido antes de virar promessa.'
      inventario: 'docs/NARRACAO-LOCAL.md (documento completo) · data/local-generation-stack.yaml → lacunas[prioridade 1]'
    proibido: 'Clonar voz de pessoa real sem autorização escrita — o `factcheck` bloqueia por direito de voz.'
    custo: 'Gravação: zero em dinheiro, alto em agenda. Síntese local: zero em dinheiro, custa noite de máquina e 4,4 GB de disco permanente.'


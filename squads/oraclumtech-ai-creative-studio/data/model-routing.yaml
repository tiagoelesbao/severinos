  # ───────────────────────────────────────────────────────────────────────────
  - asset: take_i2v
    descricao: 'Take de vídeo a partir de um still aprovado — a rota padrão de movimento do squad'
    usado_em: [P1, P2, P3, P4, P5]
    preferido:
      ferramenta: 'Hailuo (web) ou Kling (web) ou Veo via Gemini (web)'
      status: declarado_no_repo
      evidencia: 'ai-providers.yaml → video.hybrid_targets, paste_format: image_plus_prompt'
      por_que: >
        Take gerado é a etapa de maior descarte do pipeline: movimento errado, deriva de
        rosto, física estranha. O operador precisa ver, rejeitar e repetir — e as APIs
        equivalentes estão todas sem saldo ou sem cota nesta conta (ver desativados).
      tecnica:
        - 'Descreva o MOVIMENTO, não a cena: a cena já está no still aprovado'
        - 'Um movimento por take. Dois movimentos simultâneos produzem deformação.'
        - 'Duração curta (3–6s) rende muito mais aproveitamento que duração longa'
        - 'Se o plano tem rosto, prefira movimento de câmera a movimento de sujeito'
      armadilhas:
        - 'Deriva de rosto e de wardrobe ao longo do take — corte antes do ponto em que aparece'
        - 'Física de tecido e cabelo é onde o modelo entrega o resultado mais artificial'
        - 'Marca d''água de ferramenta web: verifique antes de aprovar (o farming precisou recortar 7% da base por isso)'
        - 'Saída em 720x1280 exigindo normalização para 1080x1920'
    alternativa:
      ferramenta: 'Wan 2.2 I2V via HuggingFace Inference Providers (API)'
      quando_preferir: 'Lote de takes equivalentes, quando o ganho é volume'
      status: verificado
      evidencia: 'ai-providers.yaml: "✅ VERIFICADO 2026-07-26 — O ÚNICO i2v que funciona em free tier hoje". Medido: ~53s por take, mp4 720x1280 h264.'
      limite: 'Consome o pool MENSAL gratuito da conta HuggingFace — recurso finito e compartilhado com a geração de imagem. É o crédito mais escasso do estúdio.'
    ultimo_recurso:
      ferramenta: 'Animação procedural via ffmpeg (Ken Burns / parallax 2.5D)'
      status: verificado
      evidencia: 'adapters/video/procedural.js — presets slow-push-in, slow-pull-out, pan-lr, pan-ud, parallax-2p5d, breathing; upscale 4x antes do zoompan'
      por_que: >
        Não é um fallback "pior": para plano contemplativo, cartela e b-roll de apoio,
        movimento de câmera sobre still é o código correto do formato. Determinístico,
        ilimitado, custo zero.
      quando_e_a_escolha_certa: 'P5 dark-room, cartelas do P4, plano de apoio em qualquer pipeline'
    local:
      ferramenta: 'Wan 2.2 I2V A14B (GGUF Q4_K_M, dual-stage) no ComfyUI da máquina do founder'
      status: VALIDADO
      evidencia: 'lote "vovós" — 6 takes renderizados e aproveitados (frames/render_jobs.json)'
      posicao_na_matriz: >
        É a ÚNICA rota deste arquivo inteiro com status `validado` no stack local, e por
        isso é o PADRÃO de entrega de take hoje. O bloco `preferido` acima (Hailuo/Kling/
        Veo web) não foi removido e continua valendo para o que o Wan não cobre: peça única
        de alto acabamento em que o operador quer iterar rápido, e movimento que exige
        capacidade que o Wan não entrega.
      dois_workflows:
        - id: wan22-i2v-max
          arquivo: 'assets/comfyui/workflows/wan22-i2v-max.json'
          config: '20 steps, cfg 4, split 0-6/6-20 — SEM LoRA'
          quando: 'PADRÃO. Toda peça que vale qualidade. É o que entrega.'
        - id: wan22-i2v-fast
          arquivo: 'assets/comfyui/workflows/wan22-i2v-fast.json'
          config: '4 steps, cfg 1, split 0-2/2-4 — com LoRAs lightx2v de destilação'
          quando: 'PREVIZ APENAS. Decidir se o take funciona (composição, enquadramento, se o movimento pega) antes de gastar 5x no render real.'
          proibicao: 'NUNCA entregar a partir deste. A qualidade cai, e a queda é o motivo de ele existir separado.'
      decisao_do_founder_registrada: >
        As LoRAs de destilação lightx2v foram TESTADAS E REMOVIDAS do fluxo principal —
        derrubavam a qualidade do output. Não é esquecimento nem pendência: o fluxo de
        entrega roda sem LoRA, 20 steps a cfg 4, e é assim que deve continuar.
      parametros_comuns:
        resolucao: '960×720 (metade de 1920×1440 — sem distorção a partir do 4:3)'
        fps_base: 16
        fps_final: '32 (RIFE 2x)'
        regra_de_length: 'length precisa ser 4n+1 — 25, 33, 37, 49, 65'
        acabamento: '4x-UltraSharp após o decode'
      armadilhas:
        - 'Usa o VAE 2.1 (`wan_2.1_vae.safetensors`), NÃO o 2.2 — o wan2.2_vae é do TI2V 5B, não do A14B. Trocar quebra.'
        - 'No wan22-i2v-fast, cfg DEVE cair para 1.0. LoRA de destilação com cfg alto queima a imagem.'
        - 'É render noturno: o A14B em dois estágios + RIFE + upscale 4x cabe em 8 GB com offload, mas cobra a noite por isso.'
      lacunas_locais_relacionadas:
        - { id: wan-animate-2.2, o_que_faz: 'extrai o movimento de um vídeo de entrada e sintetiza personagem novo com o MESMO movimento, preservando a luz original', status: a_validar_no_estudio }
        - { id: vace, o_que_faz: 'control video (depth + DWPose) + reference2video — resolve consistência POR CENA, não por prompt', status: a_validar_no_estudio }
        - { id: infinitetalk, o_que_faz: 'lip-sync — avatar falando a partir de imagem estática OU de vídeo existente, dirigido por áudio', status: a_validar_no_estudio }
      inventario: 'data/local-generation-stack.yaml → instalado.video_i2v e lacunas 2c/2d'
    desativados_nao_tentar:
      - { ferramenta: 'Google Veo 3.1 (API)', motivo: '429 exceeded quota em toda a faixa 4-8s — sem cota gratuita de vídeo nesta conta', data: '2026-07-27' }
      - { ferramenta: 'fal.ai', motivo: '403 Exhausted balance' }
      - { ferramenta: 'Hailuo/MiniMax (API)', motivo: '1008 insufficient balance' }
      - { ferramenta: 'Kling (API)', motivo: 'exige Access Key + Secret Key para assinar JWT; só existe uma chave' }
      - { ferramenta: 'Replicate', motivo: '401 e serviço pago por uso, não free tier' }
    custo: >
      Web: plano free de cada ferramenta, `a_validar` o teto atual. API (Wan 2.2): consome
      pool mensal HF finito. Procedural: zero, ilimitado.


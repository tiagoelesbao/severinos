# ─────────────────────────────────────────────────────────────────────────────
# ORACLUM TECH · AI CREATIVE STUDIO — ROTEAMENTO DE MODELO POR TIPO DE ASSET
#
# ⚠️ ISTO NÃO É UMA CASCATA AUTOMÁTICA. É uma MATRIZ DE RECOMENDAÇÃO para o
# OPERADOR HUMANO.
#
# Sob a regra de ouro (_BLUEPRINT.md §3.1) o squad não gera imagem nem vídeo —
# dirige a geração. Portanto este arquivo não é consumido por um roteador que
# tenta provider após provider: é consumido pelo `image-lead`, `motion-lead` e
# `sound-designer` na hora de escrever o Pacote de Direção, e chega ao operador
# dentro do card de tarefa humana.
#
# Consequência prática: ferramenta WEB com interface é cidadã de primeira classe
# aqui, não fallback. O humano tem feeling, itera, descarta e refina — coisas que
# uma chamada de API não faz. A API entra quando o valor é volume e repetição.
#
# ─────────────────────────────────────────────────────────────────────────────
# BASE DE EVIDÊNCIA (nada aqui é suposição sobre ferramenta):
#   · squads/virals-farming-squad/config/ai-providers.yaml — status REAL de cada
#     provider, com data de verificação e motivo de desativação
#   · squads/virals-farming-squad/scripts/farm-images.js — seed travada, uso de
#     imagem de referência, modo híbrido
#   · squads/virals-farming-squad/scripts/farm-takes.js + adapters/video/ — I2V e
#     animação procedural
#   · squads/virals-farming-squad/scripts/_vision.js — cascata de visão verificada
#   · squads/virals-marketing-squad/scripts/model_router.py — descoberta de
#     modelos de texto gratuitos em runtime
#
# Tudo que NÃO é demonstrável no repositório está marcado `status: a_validar`.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  versao: '1.2.0'
  criado_em: '2026-08-21'
  atualizado_em: '2026-08-30'
  mudanca_1_1_0: >
    ROTA LOCAL ACRESCENTADA. Quando este arquivo foi escrito, a única rota de geração era
    serviço em nuvem. Desde então subiu um stack em ComfyUI na máquina do founder
    (`data/local-generation-stack.yaml`). Cada rota abaixo ganhou um bloco `local:` e
    nenhuma rota de nuvem foi removida — a nuvem continua válida e em vários casos
    continua sendo a PRIMEIRA escolha. O critério de decisão entre as duas está em
    `criterio_local_vs_nuvem`, logo abaixo dos princípios.
  squad: oraclumtech-ai-creative-studio
  natureza: 'recomendação para operador humano'
  consumido_por: [image-lead, motion-lead, sound-designer, character-lead]
  entra_no_artefato: 'asset_direction (Pacote de Direção) → card de tarefa humana'
  arquivo_irmao: >
    `data/local-generation-stack.yaml` é o INVENTÁRIO (o que roda na máquina, com qual
    licença, em quanta VRAM, e onde o arquivo mora). Este arquivo é a RECOMENDAÇÃO (qual
    rota escolher para este asset). Em divergência sobre o que está instalado, o
    inventário vence; em divergência sobre qual rota usar, este arquivo vence.

principios_de_rota:
  - id: feeling_antes_de_volume
    regra: 'Peça única e de alto acabamento → ferramenta web com iteração humana. Lote repetitivo → API.'
    porque: 'O custo de uma peça-vitrine é o retrabalho, não o crédito. O custo de um lote é o crédito.'
  - id: referencia_vence_descricao
    regra: 'Quando existir imagem de referência, prefira a ferramenta que aceita upload dela.'
    porque: >
      Está registrado no ai-providers.yaml: o único provider de API que aceitava imagem
      de referência (gemini-image) foi desativado por não ter free tier nesta conta, e o
      comentário do próprio arquivo diz que ele "aproxima muito mais o resultado do
      criativo modelado do que qualquer descrição textual". Hoje o caminho de referência
      é web (Gemini web / ChatGPT), com upload manual — mais um motivo para a geração ser humana.
  - id: i2v_antes_de_t2v
    regra: 'Gere o still-chave, aprove, e só então anime. Nunca peça o take direto do texto.'
    porque: >
      Com I2V o quadro é aprovado ANTES do movimento; com T2V o erro só aparece depois
      do vídeo pronto. Todo o pipeline de takes do repo é image_to_video por essa razão
      (ai-providers.yaml → video.mode: image_to_video).
  - id: texto_nao_e_geracao
    regra: 'Rótulo, logo, headline e legenda não se geram — se compõem em pós.'
    porque: 'Nenhum gerador acerta texto de forma confiável. Cena vem do modelo; texto vem da composição.'
  - id: seed_travada
    regra: 'Uma seed por job, a MESMA em todos os assets e em todas as ferramentas que a aceitem.'
    porque: >
      Copiado do farm-images.js, que escreve no próprio card do operador: "use a MESMA
      em todas as ferramentas e takes; sem isso o criativo montado parece uma colagem
      de mundos diferentes."
  - id: registrar_o_que_foi_usado
    regra: 'O operador registra em _retorno.json a ferramenta que de fato usou.'
    porque: 'É o que mantém esta matriz viva. Dado externo copiado para dentro do arquivo apodrece.'
  - id: local_nao_muda_quem_gera
    regra: >
      A rota local NÃO transforma nenhum estágio em `executor: worker`. `stills`, `takes`
      e a geração de voz continuam `executor: human`, sempre.
    porque: >
      Regra de ouro do `_BLUEPRINT.md` §3.1. O ComfyUI é mais uma ferramenta que o humano
      opera — com a diferença de que ela roda na mesa dele em vez de num servidor de
      terceiro. Quem monta o grafo, escolhe a seed, olha o resultado e decide o retake
      continua sendo pessoa. O que muda é o campo `ferramenta_recomendada` do Pacote de
      Direção, e nada mais.

# ═════════════════════════════════════════════════════════════════════════════
# CRITÉRIO DE DECISÃO — LOCAL (ComfyUI) × NUVEM (ferramenta web / API)
#
# Não existe rota "melhor". Existe rota certa para o momento do job. As duas
# permanecem vivas, e a escolha é do operador, com o agente recomendando.
# ═════════════════════════════════════════════════════════════════════════════
criterio_local_vs_nuvem:

  pergunte_nesta_ordem:
    - pergunta: '1. O canal é monetizado ou a peça é de cliente?'
      se_sim: >
        LICENÇA VIRA CRITÉRIO TÉCNICO, e ela pesa mais que qualidade. Isso empurra para o
        local — mas só para os modelos com licença limpa que já estão no inventário
        (FLUX.2 klein 4B Apache 2.0, ChatterBox MIT, Wan 2.2, ACE-Step Apache 2.0). Não
        empurra para "qualquer modelo local": o klein 9B e o flux1-dev são locais e são
        não-comerciais. Ver `local-generation-stack.yaml → rejeitados_por_licenca`.
      se_nao: 'Siga para a pergunta 2 — licença de ferramenta web ainda precisa ser conferida, mas não é o eixo dominante.'
    - pergunta: '2. Isto é exploração criativa (descartar, refinar, decidir o look) ou execução de um look já aprovado?'
      exploracao: >
        NUVEM. Interface com histórico, variação lado a lado, edição conversacional e
        in-painting economizam mais tempo do que qualquer ganho de licença ou de custo.
        O ComfyUI é péssimo em "gerar 4 e escolher" — cada volta é uma fila.
      execucao: 'LOCAL. Look travado, prompt fechado, N assets equivalentes: é onde o render noturno ganha de lavada.'
    - pergunta: '3. Cabe na máquina?'
      como_medir: >
        Olhe o tamanho do TEXT ENCODER, não só o do UNet. O gargalo desta máquina é RAM
        (16 GB), não VRAM: o encoder roda na CPU antes de subir para a placa, e o pico é
        no encode. Quantizar o UNet resolve VRAM e não resolve isto.
      se_nao_cabe: 'NUVEM, sem discussão. Não existe workaround de RAM.'
    - pergunta: '4. Precisa hoje, com a máquina em uso?'
      se_sim: >
        NUVEM. O modo de operação padrão do local é render NOTURNO, com a máquina livre.
        Rodar com sessão aberta atropela o trabalho em curso e ainda mede errado.
      se_nao: 'LOCAL. A noite é o recurso, e a noite é longa.'
    - pergunta: '5. Há disco livre para o que este job vai produzir E para o modelo que ele exige?'
      se_nao: >
        NUVEM, ou limpe disco antes. Disco é o recurso mais apertado do estúdio hoje —
        mais que VRAM, mais que crédito de API. Contar o tamanho dos arquivos, nunca o
        delta do espaço livre (ele oscila com pagefile e sessão concorrente).

  o_que_o_local_ganha:
    - 'Licença limpa e verificável, arquivo por arquivo — o que um plano free de ferramenta web nunca dá por escrito'
    - 'Custo marginal zero por geração: não consome cota, não consome pool mensal de HuggingFace, não expira'
    - 'Sem marca d''água, sem limite de resolução de plano gratuito, sem fila de terceiro'
    - 'Reprodutibilidade real: mesmo grafo, mesma seed, mesmo resultado, daqui a seis meses'
    - 'Nada do material do cliente sai da máquina — argumento comercial, não só técnico'

  o_que_a_nuvem_ganha:
    - 'Iteração: ver, descartar e refinar em minutos, que é onde a geração de imagem de fato acontece'
    - 'Imagem de referência com upload direto (Gemini web, ChatGPT) — a rota nº 1 de consistência hoje'
    - 'Qualidade já aprovada pelo founder no look do Krea. Trocar por modelo local MUDA a estética, e isso é decisão, não detalhe'
    - 'Zero setup, zero disco, zero noite de máquina'
    - 'Capacidades que o local ainda não tem instaladas (lip-sync, foley, upscale generativo com contexto)'

  regra_de_transicao: >
    MANTIDA do `local-generation-stack.yaml` e ainda vale: o founder já aprova o look do
    Krea. Antes de migrar um tipo de asset de nuvem para local, rodar OS DOIS EM PARALELO
    por um lote e registrar a comparação em `_retorno.json`. Migrar às cegas troca uma
    estética aprovada por uma desconhecida, e o cliente percebe antes de nós.

  estado_honesto_em_2026_08_29: >
    Do stack local, só o Wan 2.2 I2V max está VALIDADO (lote "vovós", 6 takes). FLUX.2
    klein e o TTS estão instalados e conferidos, mas nenhum pixel e nenhuma faixa saíram
    em job real ainda. Foley, trilha e SFX têm workflow escrito e peso não confirmado.
    Enquanto isso for verdade, toda rota local marcada `instalado` entra no Pacote de
    Direção com rota de nuvem declarada ao lado, no campo `se_falhar`.

# ═════════════════════════════════════════════════════════════════════════════
# ROTAS POR TIPO DE ASSET
# ═════════════════════════════════════════════════════════════════════════════
rotas:

  # ───────────────────────────────────────────────────────────────────────────
  - asset: imagem_still
    descricao: 'Still de cena para o storyboard — o quadro que vira take no I2V'
    usado_em: [P1, P2, P3, P4, P5]
    preferido:
      ferramenta: 'Krea ou Leonardo.ai (web)'
      status: declarado_no_repo
      evidencia: 'ai-providers.yaml → image.hybrid_targets'
      por_que: >
        Still de cena é onde o operador mais descarta e refina. Interface com histórico,
        variação e in-painting economiza mais tempo do que qualquer ganho de API.
      tecnica:
        - 'Escreva a cena em blocos: sujeito → ação → ambiente → luz → lente → tratamento'
        - 'Gere 4 variações antes de julgar; a primeira quase nunca é a melhor'
        - 'Trave a seed do job e varie só o prompt — assim a variação é intencional'
        - 'Descreva a LUZ com a mesma precisão do sujeito: é o que separa still de cinema de still de banco'
      armadilhas:
        - 'Prompt longo demais dilui: acima de ~60 palavras o modelo começa a ignorar o fim'
        - 'Mão em primeiro plano e dedo — evite enquadramento que exija mão aberta em close'
        - 'Texto pedido dentro da imagem sai ilegível — peça a cena limpa e componha o texto depois'
    alternativa:
      ferramenta: 'FLUX.1-schnell via Cloudflare Workers AI (API)'
      quando_preferir: 'Lote grande de stills equivalentes, onde o ganho é volume e não acabamento'
      status: verificado
      evidencia: 'ai-providers.yaml: "✅ VERIFICADO 2026-07-26: FLUX responde em ~1,7s". É o provider padrão de fato do farming.'
      por_que: 'Latência de ~1,7s e a maior cota gratuita disponível entre os providers mapeados'
      limite: 'Não aceita imagem de referência (supports_reference_image: false)'
    ultimo_recurso:
      - ferramenta: 'Pollinations.ai'
        por_que: 'Sem chave, sem custo — degrau que não falha'
        limite: 'Qualidade inferior; aceitável em b-roll, não em peça-vitrine'
      - ferramenta: 'Pexels (acervo)'
        por_que: 'Quando a cena é comum (mãos postas, céu ao amanhecer, silhueta), a foto real chega mais perto do que a geração'
        obrigacao: 'Registrar atribuição (autor/URL) no retorno'
    local:
      ferramenta: 'FLUX.2 [klein] 4B (GGUF Q8_0) no ComfyUI da máquina do founder'
      workflow: 'assets/comfyui/workflows/flux2-klein-t2i.json'
      status: instalado
      status_significa: 'grafo conferido contra o /object_info da instalação real; NENHUM pixel gerado ainda'
      licenca: 'Apache 2.0 — uso comercial liberado, sem asterisco'
      config: '4 steps, cfg 1.0, sampler euler, sigmas via Flux2Scheduler, 1024×1024'
      quando_preferir: >
        Lote de stills equivalentes com look já travado, peça de canal monetizado, e todo
        caso em que a licença precisa ser demonstrável. Também quando o still é insumo
        interno (o frame que vira `{{IMAGEM_DE_ENTRADA}}` do wan22-i2v-max), porque aí não
        há iteração estética — há produção.
      quando_NAO_preferir: >
        Fase de exploração de look. Uma volta por vez em fila é o pior modo possível de
        descobrir a estética da peça. Nessa fase, Krea/Leonardo/Gemini web continuam sendo
        a rota preferida deste arquivo, e isso não é provisório.
      armadilhas:
        - 'width/height do Flux2Scheduler DEVEM bater com os do EmptyFlux2LatentImage — o scheduler calcula as sigmas em função da resolução'
        - 'cfg fica em 1.0. Subir liga o prompt negativo, dobra o tempo por step e tende a queimar a imagem'
        - 'NÃO use o nó FluxGuidance: o klein-4B tem `guidance_embeds: false`, o nó seria decoração'
        - 'Gargalo é RAM, não VRAM — o encoder bf16 tem 7,49 GiB numa máquina de 16 GB e o pico é no encode. Com sessão aberta, não roda.'
      armadilha_de_licenca: >
        Existe FLUX.2 [klein] 9B, ele é melhor, e é a primeira coisa que aparece quando se
        procura GGUF de klein. É NON-COMMERCIAL. Não serve aqui. Mesma cilada do flux1-dev
        e do flux1-krea-dev.
      ainda_nao_instalados:
        - { id: z-image-turbo, licenca: 'Apache 2.0', quando: 'iterar rápido — quando o gargalo é número de tentativas, não qualidade absoluta' }
        - { id: qwen-image, licenca: 'Apache 2.0', quando: 'TEXTO dentro da imagem — melhor renderização de texto entre os abertos' }
      inventario: 'data/local-generation-stack.yaml → instalado.imagem_t2i'
    desativados_nao_tentar:
      - { ferramenta: 'Gemini 2.5 Flash Image (API)', motivo: 'sem free tier de imagem nesta conta (limit: 0)', data: '2026-07-26' }
      - { ferramenta: 'Imagen via AI Studio', motivo: 'exige Vertex AI com billing (404 para chave do AI Studio)' }
      - { ferramenta: 'Together AI FLUX', motivo: '402 credit limit exceeded — exige saldo' }
    custo: 'Gratuito nas rotas acima. Krea/Leonardo têm plano free limitado — `a_validar` o teto atual de cada conta.'

  # ───────────────────────────────────────────────────────────────────────────
  - asset: imagem_publicitaria_produto
    descricao: 'Packshot, foto de produto, peça de e-commerce — o produto REAL com rótulo legível'
    usado_em: [P1, P6, 'backlog: tiktok-shop, delivery-food']
    preferido:
      ferramenta: 'Foto real do produto + composição (Photoshop / apps/creative-design)'
      status: decisao_arquitetural
      por_que: >
        Nenhum gerador reproduz rótulo, marca ou embalagem de um produto real de forma
        confiável — e o cliente vende AQUELE produto, não um parecido. A IA entra no
        que ela faz bem: fundo, luz, superfície, atmosfera. O produto entra como foto.
      tecnica:
        - 'Fotografe o produto em fundo neutro com luz difusa e recorte'
        - 'Gere o AMBIENTE por IA (superfície, fundo, atmosfera) e componha o produto por cima'
        - 'Sombra de contato é o que cola o produto na cena — sem ela a composição denuncia'
        - 'Reflexo especular controlado é o código de publicidade de produto (ver craft-references)'
      armadilhas:
        - 'Rótulo gerado sai com letra deformada — reprovação automática no gate'
        - 'Escala errada entre produto e ambiente é o erro mais comum da composição'
        - 'Sombra sem coerência com a luz do fundo gerado'
    alternativa:
      ferramenta: 'Gemini (web) ou ChatGPT com upload da foto do produto como referência'
      quando_preferir: 'Quando o produto precisa aparecer em contexto difícil de compor manualmente'
      status: declarado_no_repo
      evidencia: 'ai-providers.yaml → hybrid_targets com paste_format: plain_with_reference'
      limite: 'Ainda assim revise o rótulo pixel a pixel antes de aprovar'
    local:
      ferramenta: 'FLUX.2 [klein] para o AMBIENTE + composição do produto real por cima'
      workflow: 'assets/comfyui/workflows/flux2-klein-t2i.json'
      status: instalado
      quando_preferir: >
        Sempre que o ambiente for gerado. A decisão arquitetural desta rota não muda com o
        stack local: o produto continua entrando como FOTO REAL e a IA continua fazendo só
        fundo, luz, superfície e atmosfera. O que muda é onde o fundo nasce.
      ganho_especifico_da_rota_local: >
        Peça de e-commerce de cliente é o caso em que licença é perguntada por escrito.
        Ambiente gerado sob Apache 2.0 responde essa pergunta sem depender dos termos de
        um plano gratuito de ferramenta web.
      limite_que_nao_muda: 'Rótulo, marca e embalagem continuam sem ser geráveis. Local não conserta isso — nenhum modelo conserta.'
      inventario: 'data/local-generation-stack.yaml → instalado.imagem_t2i'
    custo: 'Baixo. O custo real é o tempo de composição humana, não o crédito de IA.'
    nota_de_gate: 'O `factcheck` reprova produto com rótulo ilegível ou alterado — é falsificação de embalagem, não estética.'

  # ───────────────────────────────────────────────────────────────────────────
  - asset: character_sheet
    descricao: 'Folha de referência de personagem — frente, perfil, plano médio, wardrobe travado'
    usado_em: [P2, P3, P6]
    preferido:
      ferramenta: 'Gemini (web) ou ChatGPT com imagem de referência'
      status: declarado_no_repo
      evidencia: 'ai-providers.yaml → image.hybrid_targets, paste_format: plain_with_reference'
      por_que: >
        Consistência de personagem depende de REFERÊNCIA VISUAL, e o único provider de
        API que aceitava referência está desativado por falta de cota. A rota que
        funciona hoje é upload manual em ferramenta web — exatamente o tipo de trabalho
        que a regra de ouro coloca na mão do humano.
      tecnica:
        - 'Gere primeiro UM retrato definitivo; ele vira a referência de tudo que vier depois'
        - 'Depois peça as demais poses SEMPRE com esse retrato anexado — nunca a partir do último frame usado'
        - 'Trave wardrobe peça a peça no prompt: a deriva começa pela roupa, não pelo rosto'
        - 'Registre a seed e reuse; combine seed travada + referência anexada'
      armadilhas:
        - 'Deriva acumulada: gerar a pose N a partir da pose N-1 acumula erro. Sempre volte à referência original.'
        - 'Idade percebida flutua entre gerações — fixe no prompt com número, não com adjetivo'
        - 'Etnia e biotipo derivam silenciosamente quando o prompt não os declara'
    alternativa:
      ferramenta: 'Seed travada em FLUX/Krea, sem referência'
      quando_preferir: 'Quando o personagem aparece de costas, em POV ou plano fechado de mãos — identidade sustentada por wardrobe e ambiente'
      status: verificado
      evidencia: 'farm-images.js — seed do pack propagada a todos os takes'
      limite: 'Seed sozinha NÃO garante o mesmo rosto entre prompts diferentes. É atenuação, não solução.'
    fallback_de_estrategia:
      regra: 'Se a consistência não se sustentar em 3 ciclos, mude a ESTRATÉGIA do lote, não a ferramenta.'
      como: 'Creator de costas / POV / mãos / voz sobre cena — identidade por wardrobe e ambiente'
      por_que: 'É o contorno real usado em UGC de produção, e sai mais barato que brigar com o modelo'
    local:
      situacao: 'LACUNA ABERTA — é a lacuna de prioridade 2b do `local-generation-stack.yaml`, e nenhuma das três rotas foi validada'
      por_que_importa_mais_aqui_do_que_em_qualquer_outra_rota: >
        Gerar UMA imagem boa é fácil. O difícil é a MESMA pessoa, com o mesmo rosto e a
        mesma roupa, em 8 takes, todo dia, por meses — que é exatamente o que o gênero
        `novela-recap` (P7) exige e o que já falhou uma vez no lote das "Donas", que
        saíram jovens porque citar o nome no prompt não basta: cada geração é independente.
      tres_rotas:
        - rota: 'LoRA por personagem'
          recomendacao: 'MELHOR PARA ELENCO FIXO — investigar primeiro'
          por_que: 'A identidade fica no peso do modelo, não num prompt que pode ser ignorado. Custo de VRAM existe só no treino, e treino é uma vez.'
          quando_nao_vale: 'Personagem que aparece uma vez só. Aí é overhead puro.'
          status: a_validar_no_estudio
        - rota: 'Qwen-Image-Edit (2509 / 2511)'
          licenca: 'Apache 2.0'
          recurso: 'Aceita até 3 imagens de referência, citáveis no prompt como "image 1", "image 2", "image 3"'
          por_que: 'É o equivalente local do Nano Banana / Flux Kontext, com licença limpa'
          problema: 'Em 8 GB fica apertado de verdade — só Q2_K ou Q3_K_S com Lightning LoRA, e o resultado sai visivelmente mais macio'
          status: a_validar_no_estudio
        - rota: 'PuLID / IPAdapter sobre o modelo base'
          por_que: 'Leve, roda com folga em 8 GB, resolve consistência facial a partir de uma referência'
          limite: 'Mais fraco que LoRA para identidade completa (rosto + roupa + porte)'
          status: a_validar_no_estudio
      rejeitado_por_licenca:
        - { id: flux-kontext-dev, motivo: 'Tecnicamente excelente para consistência, licença não-comercial' }
      enquanto_a_lacuna_nao_fecha: >
        A rota de nuvem acima (Gemini web / ChatGPT com referência anexada) CONTINUA SENDO
        A PREFERIDA para character sheet. Não é fallback: é a única rota demonstrada.
      moodboard_nao_resolve: >
        Moodboard trava ESTILO (luz, paleta, enquadramento); não trava IDENTIDADE. São dois
        problemas distintos e o squad vive os dois.

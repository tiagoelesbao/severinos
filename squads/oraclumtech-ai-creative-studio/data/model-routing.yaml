  - asset: upscale_finishing
    descricao: 'Ampliação e acabamento final de imagem para entrega em alta'
    usado_em: [P1, P6]
    status: a_validar
    situacao_real: >
      O repositório NÃO tem upscaler de acabamento. O único upscale existente é interno
      ao adapters/video/procedural.js — um ffmpeg 4x aplicado ANTES do zoompan só para
      dar resolução suficiente ao movimento (constante UPSCALE = 4). Isso resolve
      pixelação de pan/zoom; não é acabamento de imagem de campanha.
    preferido:
      ferramenta: 'Nano Banana Pro (ou Nano Banana 2) — upscale por prompt'
      status: a_validar_no_estudio
      fonte: 'Filmboss · IA Skills Upscale, aulas 02 e 03 (ver docs/APRENDIZADOS-CURSOS.md)'
      por_que: >
        Três vantagens que nenhum upscaler dedicado tem: (1) é o MESMO modelo que já
        gerou a imagem, então não há troca de plataforma nem re-upload no meio do fluxo;
        (2) custa uma geração normal, enquanto upscaler dedicado cobra mensalidade E por
        geração; (3) tem inteligência de contexto — reconhece foto de época, figura
        pública e lugar conhecido, e busca referências reais em vez de inventar detalhe.
      tecnica:
        - 'Gera em 2K ou 4K direto, com o prompt pedindo a ampliação'
        - 'Quando houver figura pública, lugar ou época reconhecíveis, INCLUA um parágrafo de contexto no prompt (quem é, que época, que data, que idade) — é o que ancora as referências certas'
        - 'Peça 1080x1920 (ou o formato do brief) direto na geração sempre que a ferramenta permitir; upscale é correção, não etapa planejada'
    alternativa:
      ferramenta: 'Magnific AI ou Lupa AI (upscalers dedicados)'
      status: a_validar_no_estudio
      quando_trocar: 'Só depois de esgotar o Nano Banana Pro — é a ordem que o curso recomenda para 99% dos casos'
      custo_relativo: 'Bem mais caro que geração comum, nos dois eixos: mensalidade e preço por geração'
      atrito: 'Exige baixar a imagem, subir em outra plataforma, escolher o modelo interno adequado e às vezes 1 a 3 tentativas até o estilo certo'
    para_video:
      ferramenta: 'Topaz'
      status: a_validar_no_estudio
      nota: 'Upscale de vídeo é problema diferente do de imagem — tem módulo próprio no curso. Não assumir a mesma rota.'
    armadilhas_conhecidas:
      - regra: 'Entrada ruim vira detalhe inventado'
        detalhe: >
          Quanto pior a imagem de origem, MENOS consistente o resultado — o modelo
          precisa inventar o detalhe que não existe. A saída fica mais nítida e mais
          errada ao mesmo tempo. Crítico quando o sujeito é um personagem cuja
          identidade precisa ser preservada: nesse caso, regerar em alta vence upscalar
          o material fraco.
      - regra: 'Upscale não conserta composição'
        detalhe: 'Faça upscale apenas das imagens finais já selecionadas. Ampliar candidato é queimar crédito.'
    local:
      situacao: 'PARCIAL — existe upscale local, mas ele resolve ACABAMENTO DE TAKE, não upscale generativo de imagem de campanha'
      instalado_e_validado:
        - { id: ultrasharp, arquivo: '4x-UltraSharp.pth', uso: 'acabamento do take, aplicado dentro do grafo do Wan após o decode', status: validado }
        - { id: rife, arquivo: 'rife49.pth', uso: 'interpolação 16→32 fps (não é upscale, é o par dele no acabamento)', status: validado }
        - { id: realesrgan, arquivo: 'RealESRGAN_x2plus.pth', uso: 'ampliação genérica', status: instalado }
      o_que_isso_NAO_e: >
        Upscaler por difusão não é. UltraSharp e RealESRGAN ampliam e afiam o que já existe;
        eles não têm inteligência de contexto e não recuperam detalhe ausente. Para imagem
        de campanha em que o upscale precisa reconhecer época, figura pública ou lugar, a
        rota continua sendo a de nuvem acima (Nano Banana Pro).
      a_regra_que_o_local_reforca: >
        "Entrada ruim vira detalhe inventado" vale igual aqui, e com uma saída melhor: como
        gerar de novo custa apenas noite de máquina, REGERAR EM ALTA vence upscalar material
        fraco quase sempre. Na nuvem essa escolha custa crédito; no local, não.
      preferir_gerar_na_resolucao_certa: 'Peça a resolução final direto no `EmptyFlux2LatentImage` (e no Flux2Scheduler, com os mesmos valores). Upscale é correção, não etapa planejada.'
      inventario: 'data/local-generation-stack.yaml → instalado.interpolacao_e_upscale'
    custo: 'Nano Banana Pro: custo de uma geração comum. Magnific/Lupa: a_validar, sabidamente mais caro. Local: zero em dinheiro.'

  # ───────────────────────────────────────────────────────────────────────────
  - asset: modelo_treinado_lora
    descricao: 'Clone de pessoa, produto ou estilo, treinado uma vez e reusado em N gerações'
    usado_em: [P1, P2, P3, P6]
    status: a_validar_no_estudio
    fonte: 'AI Image Creator PRO · Módulo 15 aula 4 (Fal.ai) e Filmboss · IA Boss Módulo 05 aula 06 (Krea). Minerado 2026-08-30.'

    quando_esta_rota_se_justifica: >
      Só depois que a escada mais barata reprovar num job real. Ver
      `prompt-architectures.yaml` → `consistencia_por_palavra_gatilho`: (1) palavra-gatilho
      no ChatGPT, custo zero; (2) pesos de referência no Kling/Krea, sem treino; (3) LoRA.
      O `character-lead` NÃO começa por LoRA.

    preferido:
      ferramenta: 'Krea — Image > Flux > Train'
      status: declarado_no_curso
      dataset: '20 a 50 fotos (o professor usou 27 e 36)'
      configuracao: 'Nome do modelo, resto no default, PASSOS DE TREINO NO MÁXIMO'
      tempo: '20 a 40 minutos'
      uso: 'Selecionar o modelo em Style; intensidade de 0.7 para cima'

    alternativa:
      ferramenta: 'Fal.ai — Flux Pro Trainer + Flux 1.1 Ultra Finetuned'
      status: declarado_no_curso
      dataset: '10 a 30 imagens'
      modo: 'personagem | produto | estilo — NUNCA `geral`'
      forca_do_modelo: '1.0 é o ponto ideal. Acima fica estranho, abaixo perde característica.'
      legendagem_automatica: 'Deixar habilitada — a plataforma lê cada imagem e cria a legenda, e isso melhora o treino.'
      operacao: >
        O treino devolve um ID de modelo. SALVAR ESSE ID fora da plataforma (bloco de
        notas), porque a lista fica impossível de navegar depois de alguns treinos.

    regras_de_dataset_que_valem_para_as_duas:
      - 'Variar ÂNGULO — rosto de todos os lados; objeto com noção tridimensional'
      - 'Variar ILUMINAÇÃO — janela, sol duro, luz bonita'
      - 'Variar ou REMOVER o FUNDO — ver armadilha abaixo'
      - 'Variar EXPRESSÃO — sorrindo e sério'
    armadilha_medida_do_fundo: >
      O professor do Filmboss fotografou todas as 36 imagens no mesmo set e admite o
      resultado: "tem tripé, tem coisas aparecendo... quando você for gerar outras
      imagens, ele vai meio que copiar essas coisas também, vai colocar um tripé lá no
      fundo". O modelo aprende o CENÁRIO junto com o sujeito. Variar o fundo é tão
      importante quanto variar o ângulo.

    o_que_o_lora_aprende_e_o_que_nao_aprende:
      aprende: >
        ESTRUTURA. Todas as fotos de treino do controle de Xbox eram do modelo PRETO, e o
        modelo gerou corretamente versões branca, azul e vermelha. Dataset de produto NÃO
        precisa cobrir todas as variantes de cor.
      nao_aprende: >
        Detalhe pequeno demais para o quadro. A letra "B" do controle saiu errada mesmo
        com o modelo treinado — é orçamento de pixel, e treino não resolve orçamento de
        pixel. Ver `imagem-refino-playbook.yaml` §8.1.

    bloqueio_local_conhecido: >
      Não há rota local de treino no stack atual. O gargalo é o mesmo do Qwen-Image: RAM
      de 16 GB. Esta rota é de NUVEM enquanto o hardware não mudar. Ver
      `local-generation-stack.yaml`.
    custo: 'Krea e Fal.ai: crédito por treino + crédito por geração. a_validar.'

  # ───────────────────────────────────────────────────────────────────────────
  - asset: relight_e_troca_de_fundo
    descricao: 'Trocar o cenário RECALCULANDO a luz, a sombra e a saturação do sujeito'
    usado_em: [P1, P2, P6]
    status: a_validar_no_estudio
    fonte: 'AI Image Creator PRO · Módulo 12 aula 1 (IC-Light V2 no Fal.ai) e Módulo 05 (Recraft Frame). 2026-08-30.'

    o_problema_que_resolve: >
      Ao trocar o cenário por edição comum, a luz do sujeito continua sendo a do cenário
      antigo — o caso do corpus é uma personagem que foi para uma estação de metrô com a
      luz de sol da rua ainda batendo nela. É a anomalia que o `gate-image-lab` ainda não
      cobre (o `IL-PD-07` cobre reflexo, não direção de luz).

    preferido:
      ferramenta: 'IC-Light V2 via Fal.ai'
      configuracao: 'As opções vêm otimizadas — o curso recomenda não mexer. Saída em PNG.'
      o_que_ele_faz: 'Ajusta luz, sombra e saturação do sujeito para o novo fundo, e a cor fica mais viva porque há mais incidência de luz.'

    alternativa:
      ferramenta: 'Recraft — Frame (com o PNG recortado)'
      o_que_ele_faz: >
        Gera o fundo e AMBIENTA o PNG nele: "trouxe um leve magenta, e onde estava mais
        claro deu uma escurecida, porque não está tendo luz direta".
      contrapartida_medida: 'Às vezes acrescenta formas que não pertencem ao objeto. Correção manual no Photoshop ou inpaint.'
      requisito: 'O prompt precisa declarar O QUE É o PNG, além de descrever o fundo — senão o fundo não tem coerência com ele.'

    a_regra_de_ORDEM_que_nao_pode_ser_invertida: >
      RELIGHT VEM ANTES DO UPSCALE. O modelo de reiluminação derruba a resolução — "ele
      faz um downscale, trabalha na imagem, tenta compensar, mas perde muito da nitidez".
      Quem upscala primeiro paga o upscale duas vezes. Registrado em
      `imagem-refino-playbook.yaml` §5 e reconfirmado aqui.

    o_criterio_de_quando_NAO_editar: >
      "Quando a mudança for muito drástica, talvez seja melhor alterar o prompt e fazer a
      imagem de novo." Existe um ponto em que editar sai mais caro que regerar, e ele é
      definido pela LUZ, não pelo tamanho da área editada.
    custo: 'Fal.ai: crédito por geração. a_validar.'

# ═════════════════════════════════════════════════════════════════════════════
# APOIO — rotas que NÃO geram asset final, mas alimentam a direção.
# Estas sim rodam como worker (executor determinístico), sem violar a regra de ouro.
# ═════════════════════════════════════════════════════════════════════════════
rotas_de_apoio:

  - funcao: analise_visual_de_referencia
    usado_em: 'estágio research (worker)'
    ferramenta: 'Cascata de visão do _vision.js'
    status: verificado
    evidencia: '_vision.js — verificado 2026-07-26'
    ordem:
      - 'Gemini (via LocalTranscriber.analyzeImageWithGemini) — primário'
      - 'openrouter/free (~2,5s)'
      - 'google/gemma-4-31b-it:free (~4,6s)'
      - 'nvidia/nemotron-nano-12b-v2-vl:free (~9,3s) — último de propósito'
    armadilha_medida: >
      O nemotron ALUCINOU sobreposições que não existiam no frame ("etiqueta do criador",
      "botões") enquanto gemma e openrouter/free devolveram lista vazia corretamente. Um
      modelo instruído a "listar a UI" inventa UI se não houver. O prompt precisa
      autorizar explicitamente a lista vazia.
    licao_para_o_squad: 'Vale para todo prompt de análise deste estúdio: autorize o "não há nada aqui".'

  - funcao: texto_e_sintese
    usado_em: 'todos os estágios de agente'
    ferramenta: 'Descoberta em runtime via model_router.py (OpenRouter free)'
    status: verificado
    evidencia: 'model_router.py — roteador oficial openrouter/free primeiro, catálogo consultado com cache de 6h'
    principio: >
      A lista fixa de modelos apodrece: 3 dos 4 modelos fixos do recast_engine sumiram do
      catálogo e devolveram 404. A correção é sempre a mesma — perguntar à fonte, com
      cache e degradação honesta. Este squad não mantém lista fixa de modelo de texto.
    custo: 'Gratuito.'

  - funcao: transcricao_e_legenda
    usado_em: 'estágio assembly (worker)'
    ferramenta: 'Whisper local com --word_timestamps (via _speech.js e apps/video-studio)'
    status: verificado
    evidencia: '_speech.js — timestamp por palavra, cache ao lado do áudio, ~18s por transcrição'
    licao_registrada: >
      Distribuir o texto proporcionalmente à duração assume ritmo constante de fala, e o
      erro acumula. Subdividir bloco do Whisper em partes iguais reintroduz o mesmo erro
      dentro do bloco. Só o timestamp POR PALAVRA elimina a estimativa.
    regra: 'Legenda nunca é digitada na mão nem estimada por proporção.'
    custo: 'Zero, local.'

  - funcao: composicao_on_brand
    usado_em: 'estágio stills (finalização) e P6'
    ferramenta: 'apps/creative-design · design_creative.py'
    status: verificado
    para_que: 'Aplicar tipografia, paleta, logo e safe area do brand-config sobre a cena gerada'
    custo: 'Zero, local.'


# ═════════════════════════════════════════════════════════════════════════════
# MATRIZ DE MOTOR DE VÍDEO — escolher por RECURSO, não por qualidade
#
# Fonte: AI Image Creator PRO · Módulo 12 (8 aulas). O curso rodou O MESMO PROMPT
# em três plataformas e comparou os resultados lado a lado — é a evidência
# comparativa mais limpa de todo o corpus. Minerado em 2026-08-30.
#
# POR QUE ISTO EXISTE
# O squad trata o Kling como padrão. A comparação mostra que ele NÃO é o melhor em
# qualidade nem em aderência ao prompt: é o dono de um recurso que os outros não
# têm. A pergunta certa não é "qual é melhor", é "este plano precisa de qual
# RECURSO?". Se não precisa de nenhum, vá no que entrega melhor.
# ═════════════════════════════════════════════════════════════════════════════
matriz_de_motor_de_video:

  status: a_validar_no_estudio
  aviso_de_versao: >
    Os testes do curso foram feitos em Kling 1.5/1.6 e Runway Gen-3/Gen-4. O Filmboss,
    mais recente, já opera em Kling 2.1 com start+end frame nativo. A conclusão sobre
    RECURSOS EXCLUSIVOS sobrevive à mudança de versão; os julgamentos de qualidade
    relativa devem ser reconferidos antes de virar regra dura.

  a_pergunta_de_roteamento:
    - '1. Este plano precisa travar o movimento de uma REGIÃO específica? → Kling (Motion Brush)'
    - '2. Precisa de frame inicial E final? → Kling 2.1 (ver camera-moves.yaml)'
    - '3. Precisa transformar um vídeo que já existe? → Runway (vídeo-para-vídeo)'
    - '4. Precisa mudar o FORMATO de um vídeo pronto? → Runway (expandir)'
    - '5. Precisa animar a FALA de um personagem? → Runway (transfere de um vídeo-base)'
    - '6. Precisa de morph suave entre duas imagens? → Luma Ray 2 (keyframes)'
    - '7. Não precisa de nenhum recurso especial? → Minimax. É o que entrega melhor.'

  motores:

    - motor: 'Kling'
      recurso_exclusivo: 'Motion Brush'
      o_que_e_o_motion_brush: >
        Pintar uma região e desenhar a TRAJETÓRIA que ela deve seguir. E — o detalhe que
        vale mais — pintar de PRETO o que deve ficar PARADO. É "positivo vence negativo"
        na forma de máscara: em vez de proibir movimento no prompt, trava-se a região.
      outros_pontos_fortes: ['presets de controle de câmera', 'frame inicial + frame final']
      fraquezas_medidas:
        - 'Fila muito demorada, inclusive para assinante Pro'
        - 'ROSTO e MÃO em image-to-video saem ruins de forma consistente — "não consegue fazer com muita perfeição rostos e mãos"'
        - 'Flicker e artefato leve são comuns; o curso o classifica como qualidade INTERMEDIÁRIA'
        - 'Motion Brush e presets de câmera ficam atrás do plano Pro'
      onde_ele_de_fato_ganha: 'Texto-para-vídeo, onde respeitou prompts longos e específicos melhor do que o Runway.'
      recurso_extra: >
        Elements / Ingredients — até 4 imagens (pessoa + roupa + ambiente + objeto)
        fundidas num take. Roda no 1.6. Rendimento medido: 4 opções, 2 aproveitáveis.

    - motor: 'Runway'
      recursos_exclusivos:
        video_para_video: >
          Mantém a ESTRUTURA do vídeo e troca o estilo pelo texto. Uma cachoeira virou
          cachoeira de lava e cachoeira de areia, com a rocha reagindo coerentemente ao
          novo material. Nenhum outro motor da comparação faz isso.
        expandir_formato: >
          Horizontal → vertical (e o inverso) por preenchimento das bordas. O resultado
          medido foi bom: continuou a água batendo nas pedras e respeitou o movimento de
          câmera. É a rota para reaproveitar peça 16:9 em 9:16 SEM regerar nada.
        animar_a_fala: >
          Um vídeo-base de alguém falando de frente transfere boca, olhos e cabeça para
          uma imagem estática. O vídeo-base pode ser gravado na webcam.
      fraquezas_medidas:
        - 'Texto-para-vídeo não respeita o prompt — nas duas gerações do teste, ignorou a trajetória de câmera pedida'
        - 'Apenas 2 vídeos por fila'
        - 'ARMADILHA DE PLANO: frame-a-frame e expandir formato só existem no modo TURBO, que tem qualidade inferior. O modo Alpha, melhor, não os oferece — e só aceita landscape.'
      frame_a_frame: 'Melhor que o do Kling na mesma comparação, mesmo preso ao Turbo.'

    - motor: 'Minimax (Hailuo)'
      recurso_exclusivo: 'Nenhum. E é exatamente esse o ponto.'
      onde_ele_ganha:
        - 'A melhor qualidade de entrega da comparação'
        - 'A melhor aderência ao prompt — respeitou a subida de câmera do pé ao rosto do cavaleiro em 5 de 5 gerações'
        - '5 vídeos por fila, contra 2 do Runway'
        - 'Aceita imagem horizontal e vertical sem trocar de modelo'
      minimax_reference:
        o_que_e: 'Vídeo a partir de uma imagem de referência de personagem, via Freepik.'
        evidencia_que_convence: >
          Preservou um leve estrabismo no olho direito da modelo — um traço que nenhuma
          descrição textual carregaria. É o teste de consistência mais duro do corpus.
      a_regra_que_sai_daqui: >
        Se o plano não precisa de recurso exclusivo — e a MAIORIA não precisa — o motor
        certo é o que entrega melhor, não o que o estúdio já conhece.

    - motor: 'Luma (Ray 2)'
      recurso: 'Keyframes — primeiro e último frame, com foco em MORPH e transição suave'
      requisito_duro_medido: >
        As duas imagens precisam ter PROPORÇÃO similar, ÂNGULO parecido, POSIÇÃO
        equivalente no quadro e FUNDO igual. Sem isso o morph degenera em fade-in/fade-out.
        Foi assim que o curso preparou os três pares (jaquetas, celulares, relógios).
      rendimento_medido: '6 gerações para 3 morphs aproveitáveis — ~2 gerações por morph.'
      truque_de_correcao: >
        Quando o defeito é local, NOMEAR NO PROMPT o objeto que o membro toca conserta.
        Os pés saíam mal numa escada; incluir "escada" no prompt resolveu. É irmão da
        regra do MEMORY: "objeto não nomeado é objeto inventado".

  o_que_isto_muda_no_squad:
    - >
      O `motion-lead` passa a escolher motor por recurso. A pergunta de roteamento acima
      entra no card, antes do prompt.
    - >
      Rosto e mão em I2V são fracos NO KLING especificamente. Se o plano tem rosto em
      close e movimento, testar outro motor antes de gastar tentativas.
    - >
      "Expandir formato" abre uma rota que o squad não tinha: a peça 16:9 do dark estoico
      pode virar 9:16 sem regerar imagem nenhuma. Fica como teste barato de alto retorno.

# ═════════════════════════════════════════════════════════════════════════════
# CUSTO — leitura relativa, não tabela de preço
# ═════════════════════════════════════════════════════════════════════════════
economia:
  recurso_mais_escasso_na_rota_local:
    o_que: 'DISCO e NOITE DE MÁQUINA — nesta ordem'
    por_que: >
      Desde que o stack local subiu, o recurso escasso do estúdio deixou de ser crédito de
      API. Disco livre estava em ~31 GB em 2026-08-28, e um único modelo de imagem come
      11,81 GiB. Noite de máquina é o outro: o modo de operação padrão é render noturno,
      com a máquina livre, e cada job disputa as mesmas noites.
    o_que_NAO_e_o_gargalo: >
      VRAM. A leitura antiga ("8 GB é o teto que decide tudo") estava mal calibrada: com
      offload e render noturno o setup engole modelo pesado — o Wan A14B em dois estágios é
      a prova. A regra real é otimizar por QUALIDADE MÁXIMA aceitando lentidão.
    o_limite_que_de_fato_morde: >
      RAM de 16 GB. O text encoder roda na CPU antes de subir para a placa e o pico é no
      encode — o encoder do FLUX.2 klein sozinho pede 7,49 GiB. Quantizar o UNet resolve
      VRAM e não resolve isto. Ao avaliar modelo novo, olhar o tamanho do ENCODER.
    consequencia_de_orcamento: 'O `*budget` do `exec-producer` conta GB e noites, não dólar nem crédito.'
  recurso_mais_escasso_na_rota_de_nuvem:
    o_que: 'Pool mensal gratuito da conta HuggingFace'
    por_que: 'É compartilhado entre geração de imagem (FLUX) e o único I2V que funciona em free tier (Wan 2.2)'
    consequencia: 'Gastar HF em still barato deixa o estúdio sem take. Still vai para Cloudflare/web; HF fica reservado ao I2V.'
    nota_de_2026_08_29: >
      Com o Wan rodando local e validado, a pressão sobre esse pool cai muito: o I2V de
      entrega saiu da nuvem. O pool volta a ser o que era — reserva, não gargalo diário.
  recurso_ilimitado:
    o_que: 'Animação procedural via ffmpeg e composição local'
    consequencia: 'Todo plano que aceita movimento de câmera sobre still deveria usar essa rota antes de queimar cota'
  custo_real_do_estudio:
    o_que: 'Tempo do operador humano'
    por_que: >
      Sob a regra de ouro, o gargalo do pipeline não é crédito de API — é agenda de
      pessoa. Por isso o Pacote de Direção é o artefato mais importante do squad: cada
      tentativa evitada vale mais que qualquer economia de crédito.
  regra_de_orcamento: >
    O exec-producer estima o job em NÚMERO DE CARDS HUMANOS e variações pedidas, não em
    créditos. Créditos são o custo visível; retrabalho humano é o custo que estoura o prazo.

# ═════════════════════════════════════════════════════════════════════════════
manutencao:
  responsavel: [image-lead, motion-lead]
  gatilho_de_revisao:
    - 'Provider desativado voltar a ter cota (reativar e registrar a data)'
    - 'Operador reportar em _retorno.json que a ferramenta recomendada falhou 3x'
    - 'Qualquer item `a_validar` ser testado — atualizar o status e a evidência'
    - 'Item do `local-generation-stack.yaml` sair de `instalado` para `validado` — a rota local correspondente aqui muda de posição na recomendação'
    - 'Modelo local novo entrar no inventário — só entra aqui depois de existir lá, nunca antes'
    - 'Comparação local × nuvem em paralelo ser feita para um tipo de asset — registrar o vencedor e a evidência (regra_de_transicao)'

# ───────────────────────────────────────────────────────────────────────────
# PACK DE TRILHAS, AMBIENCIAS E SFX — catalogo por segmento / tipo / intencao
#
# Cada peca foi GERADA localmente. Nao ha sample de terceiro aqui — o que
# elimina de uma vez a questao de licenca de biblioteca musical.
#
# Consumido por: @sound-designer (`audio`), @editor (montagem), @exec-producer
#
# COMO USAR
#   1. Ache o SEGMENTO pelo que a peca faz (trilha / leito / ambiencia / sfx)
#   2. Dentro dele, o TIPO e o nicho ou a familia
#   3. `intencao` diz em que momento do video a peca entra — e o campo que decide
# ───────────────────────────────────────────────────────────────────────────

meta:
  versao: '1.0.0'
  criado_em: '2026-08-29'
  squad: oraclumtech-ai-creative-studio
  total_pecas: 21
  origem: 'geracao local no ComfyUI — nenhum sample de terceiro'
  regenerar: 'python assets/comfyui/run_batch.py --only aud-'

engines:
  ace:
    nome: 'ACE-Step 3.5B'
    licenca: 'Apache 2.0 — uso comercial livre, sem teto de faturamento'
  sao:
    nome: 'Stable Audio Open 1.0'
    licenca: 'Stability Community License — comercial liberado abaixo de USD 1M/ano'

# As pecas saem do gerador com niveis MUITO diferentes — as ambiencias vieram
# a -42 dB de media, inaudiveis para julgar. O arquivo que esta aqui ja veio
# nivelado; o cru continua em ComfyUI/output/pack-audio/.
nivelamento:
  aplicado_em: 'copias deste diretorio (as de audicao e uso)'
  trilha_leito_ambiencia: 'loudnorm EBU R128, I=-18 LUFS, TP=-1.5 dBTP, LRA=11'
  sfx: 'normalizacao de pico a -1 dBFS (transiente curto; loudnorm distorceria o ganho)'
  atencao: >
    Este e o nivel de AUDICAO, para comparacao justa. O nivel de MIXAGEM e outra
    decisao e e do editor: leito e ambiencia entram bem abaixo da narracao. Regra
    de partida: voz a -16 LUFS, leito 12 a 15 dB abaixo, ambiencia 18 a 22 abaixo.

segmentos:
  01-trilhas:
    nome: 'Trilhas'
    o_que_e: 'Musica COM estrutura e progressao. Tem inicio, meio e fim.'
  02-leitos:
    nome: 'Leitos'
    o_que_e: 'Cama atmosferica SEM melodia. Sustenta fala sem disputar com ela.'
  03-ambiencias:
    nome: 'Ambiencias'
    o_que_e: 'Som de LUGAR. Diz onde a cena acontece.'
  04-sfx:
    nome: 'SFX'
    o_que_e: 'Pontuacao. Cai numa palavra ou num corte, nao se estende.'

pecas:


# ───────────────────────────────────────────────────────────────────────────
# O Stable Audio Open recebe a duracao no condicionamento e compoe uma PECA com
# arco — entra, sustenta e DESVANECE. Tres dos quatro leitos cairam de 20 a 35 dB
# nos ultimos 15 s. Para uso como cama, o que serve e o LOOP, nao o arquivo cheio.
loops:
  formato: 'WAV 16 bits / 44,1 kHz — NAO mp3'
  por_que_nao_mp3: >
    MP3 carrega atraso de codificador e preenchimento nas bordas do arquivo, o que
    insere um buraco audivel na volta do loop na maioria dos reprodutores.
  como_foi_feito: 'maior janela estavel + crossfade de 2 s do fim sobre o comeco'
  verificado: 'degrau na emenda medido 7 a 43 dB ABAIXO do degrau tipico do material'
  regenerar: 'python assets/comfyui/faz_loops.py'

lacunas:
  - o_que_falta: 'Stems separados (grave / medio / agudo) das trilhas'
    por_que_importa: 'Permite abaixar so o medio sob a narracao, em vez do volume inteiro'
  - o_que_falta: 'Trilha de mais de 60s'
    por_que_importa: >
      O ACE-Step chega a alguns minutos, mas nao foi testado aqui. Ate testar,
      a montagem repete e cruza blocos de 60s.

manutencao:
  regra: >
    Peca nova entra pelo catalogo em assets/comfyui/pecas_audio.py e vem para ca
    por `python assets/comfyui/organiza_audio.py`. Nao copiar arquivo na mao —
    o INDEX e a VALIDACAO sao gerados a partir do catalogo.


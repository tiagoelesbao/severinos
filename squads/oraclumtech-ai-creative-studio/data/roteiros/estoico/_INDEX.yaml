# ─────────────────────────────────────────────────────────────────────────────
# ROTEIROS DO CANAL DARK DE ESTOICISMO — 6 peças
#
# Consumido por: head-of-copy (escrita), sound-designer (narração e trilha),
#                image-lead (pack visual), editor (composição)
#
# Duração NÃO é estimativa: sai de `conta_roteiros.py`, que conta o texto
# narrado real e divide pelo ritmo MEDIDO da estrutura correspondente.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  versao: '2.0.0'
  criado_em: '2026-08-29'
  squad: oraclumtech-ai-creative-studio
  pipeline: 'P5 dark-room'
  formato_master: '16:9 — YouTube horizontal'
  total_narracao: '28m22s nas 6 peças'
  medir_de_novo: 'python assets/comfyui/conta_roteiros.py --srt'

# ─────────────────────────────────────────────────────────────────────────────
# AS DUAS ESTRUTURAS — ambas modeladas por transcrição integral
procedencia:

  estrutura_A:
    natureza: MODELADA
    fonte: 'docs/referencias/estoico/v1-praticas/ — 34m15s, 4368 palavras'
    ritmo_medido: '127,5 wpm'
    gramatica:
    - 'Abertura em 10 movimentos, começando por PERGUNTA de promessa'
    - 'Citação de autoridade NO MEIO da abertura, confirmando a tese já dita'
    - 'Prática numerada: título → princípio → ANEDOTA HISTÓRICA → aplicação → desafio com prazo'
    - 'Pedido de like no miolo, condicional'
    adaptacao: >
      A referência tem 10 práticas em 34 minutos; aqui são 3 em ~4m40s. A gramática
      é a mesma, muda a contagem. Comprimir não inventa nada.

  estrutura_B:
    natureza: MODELADA
    fonte: 'docs/referencias/estoico/v2-reflexoes/ — 42m17s, 6391 palavras'
    ritmo_medido: '151,1 wpm'
    gramatica:
    - 'Abertura começando por AFIRMAÇÃO poética, não por pergunta'
    - 'Par de perguntas de dor depois da premissa'
    - 'CTA EMPILHADO na abertura — comentário + like + inscrição + compartilhar'
    - 'Reflexão numerada: título → CITAÇÃO COMO EPÍGRAFE → imersão em 2ª pessoa → cenário imaginado → pergunta socrática → paralelismo retórico → metáfora estendida → visualização aplicada → ressalva ética'
    - 'Sem anedota histórica, sem desafio com prazo, sem pedido de like no miolo'
    inversao_central: >
      Na A a citação vem no MEIO da abertura. Na B ela ABRE cada bloco. É a
      diferença mais importante entre as duas.

  quando_usar_cada_uma:
    A: 'Quando o espectador procura o que FAZER. Conteúdo de ação.'
    B: 'Quando o espectador procura como ESTAR. Conteúdo de estado — funciona como escuta, sem exigir caneta na mão.'

# ─────────────────────────────────────────────────────────────────────────────
# A CORREÇÃO QUE PRECISA SER DITA
sound_design_do_genero:
  regra: 'ESTE GÊNERO NÃO USA SFX.'
  fonte: 'dark-estoicismo-playbook.yaml → audio.efeitos'
  citacao: >
    "Praticamente ausentes. O gênero NÃO usa SFX. Whoosh e impacto pertencem a
    outro formato; aqui quebrariam a atmosfera."
  o_que_isso_significa: >
    O pack `04-sfx/` que você aprovou NÃO entra nas peças estoicas. Ele foi feito
    para novela-recap, anúncio e institucional, onde a pontuação sonora ajuda.
    Aqui a camada de áudio é narração + leito contínuo, e nada mais.
  ambiencia: >
    Pode entrar MUITO baixa, se a imagem pedir — `am-templo-pedra-eco-LOOP.wav`
    casa com a cena do templo. Mas é presença, não evento: entra e fica, não pontua.
  trilha: >
    Contínua do primeiro ao último minuto. A referência não corta uma única vez em
    34 minutos — corte de trilha em peça longa quebra o transe.


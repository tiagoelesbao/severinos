# ─────────────────────────────────────────────────────────────────────────────
plano_de_imagem:
  total: '39 imagens — 7 por peça na estrutura A, 6 na B'
  catalogo: 'assets/comfyui/pack_visual_estoico.py'
  geracao: 'python assets/comfyui/run_batch.py --only cnl-'
  formato: '1344×768 na geração; acabamento leva a 2688×1536 (LITE) ou 4032×2304 (PRO)'
  em_tela: >
    Cada imagem cobre o trecho marcado com [img NN] no roteiro. Como a narração é
    mais longa que o material único, a sequência REPETE — com movimento e transição
    diferentes na segunda volta, para a repetição não se denunciar.
  custo:
    geracao_crua: '~25 s por imagem → ~16 min para as 39'
    acabamento_LITE: '~175 s → ~1,9 h'
    acabamento_PRO: '~360 s → ~3,9 h'
  fluxo_com_inspecao_do_founder:
  - '1. Gerar as 39 CRUAS — barato'
  - '2. Folha de contato por peça → INSPEÇÃO E APROVAÇÃO DO FOUNDER'
  - '3. Só as aprovadas recebem acabamento'
  por_que_nessa_ordem: >
    Gastar 4 h de acabamento antes da inspeção é gastar no lugar errado. E a
    inspeção tem que ser ESTRUTURAL antes de textural — contar membros e elementos
    repetidos, e perguntar de cada objeto se ele tem função na cena.

# ─────────────────────────────────────────────────────────────────────────────
plano_de_voz:
  regra: >
    Não há voz canônica — decisão do founder. O portfólio é escolhido por caso, e
    aqui isso vira teste real: peças diferentes com vozes diferentes.
  o_que_este_desenho_isola:
    A1_vs_A2: 'mesma VOZ, ENGINE diferente (PT-BR vs 23-Lang) — isola o engine'
    A3_vs_B1: 'mesma VOZ, ESTRUTURA diferente — isola o roteiro'
    B2: '06-en-man foi validada COM RESSALVA (sílaba tônica). Peça longa testa se a ressalva aparece.'
  atencao: >
    Nenhum par do plano muda duas coisas ao mesmo tempo. Se mudar, o teste perde o
    valor — e o gargalo medido do pack de voz é prosódia, que só aparece isolando.
  timing: 'smart_natural — `stretch_to_fit` está proibido'

plano_de_trilha:
  leito_continuo: '02-leitos/contemplativo/le-contemplativo-mistico-LOOP.wav'
  abertura: '01-trilhas/dark-estoicismo/tr-estoico-solene.mp3'
  virada: '01-trilhas/dark-estoicismo/tr-estoico-tensao.mp3 — só em B2, na reflexão 2'
  sfx: 'NENHUM — ver sound_design_do_genero'
  nivel: 'leito 12 a 15 dB abaixo da narração'

# ─────────────────────────────────────────────────────────────────────────────
# O QUE FALTA NO BANCO
lacunas:
  - id: voz-grave-masculina-publicavel
    o_que_falta: 'Uma voz MASCULINA GRAVE que possa ser publicada'
    por_que_importa: >
      É o registro que o founder quer para estoicismo, e hoje as três vozes que o
      têm são de pessoa real e não podem ir ao ar.
    caminhos:
      - 'Gravar uma referência própria (ou contratar locutor uma vez) e clonar'
      - 'RVC sobre voz genérica — já instalado, move timbre e altura sem clonar pessoa'
      - 'Referência de acervo em domínio público (LibriVox PT-BR) com narrador grave'
      - 'Licenciar voz de catálogo comercial (ver data/bancos-de-voz.yaml)'
  - id: teste-de-sotaque
    o_que_falta: 'Julgamento de ouvido do founder sobre quais amostras soam PT-BR de verdade'
    por_que_importa: 'WER mede fidelidade ao texto, NÃO mede sotaque. Só o ouvido decide isso.'

# ─────────────────────────────────────────────────────────────────────────────
manutencao:
  regra: >
    Toda voz nova entra como pasta própria, com a MESMA frase de teste, para a
    comparação continuar justa. Voz sem `pode_publicar` preenchido não entra em job.
  script: 'O organizador vive no scratchpad; se virar rotina, mover para services/'

# ─────────────────────────────────────────────────────────────────────────────
# VALIDAÇÃO DO FOUNDER — 2026-08-29
#
# Esta seção é AUTORIDADE sobre os campos `recomendacao` acima: onde divergir,
# vale o que está aqui. Foi ouvido, não medido.
# ─────────────────────────────────────────────────────────────────────────────
validacao_do_founder:

  data: '2026-08-29'
  documento: 'VALIDACAO.md (preenchido pelo founder)'

  decisao_estrutural: >
    NÃO haverá voz canônica única. O squad mantém um PORTFÓLIO validado, dividido
    em dois conjuntos: um para GERAÇÕES OFICIAIS (publicável) e outro para ESTUDO
    (clones aprovados esteticamente, mas ainda sem base de direito para publicar).
    Cada peça escolhe a voz pelo caso, não por padrão.

  # ── conjunto OFICIAL — aprovado e publicável ──────────────────────────────
  oficial:
  - id: '01-voz-casa-ptbr'
    veredito: validado
  - id: '02-voz-casa-23lang'
    veredito: validado_com_observacao
    observacao: 'Voz e personagem aprovados. O problema estava no timing stretch_to_fit, não na voz.'
  - id: '03-male-02'
    veredito: validado
    nota: 'Aprovada nos DOIS modelos — 23-Lang e PT-BR'
  - id: '06-en-man'
    veredito: validado_com_observacao
    observacao: 'Algumas palavras erraram a sílaba tônica ou saíram distorcidas'
  - id: '09-female-01'
    veredito: validado
    nota: 'Aprovada no 23-Lang. No F5-TTS foi REJEITADA — mesma voz, engine pior.'
  - id: '08-f5-ptbr'
    veredito: validado_com_observacao
    observacao: >
      Textura e entonação com qualidade MENOR que o 23-Lang. Erro de entonação no
      começo. Serve, mas não é a primeira escolha.

  # ── REJEITADOS — saem do portfólio ────────────────────────────────────────
  rejeitados:
  - id: '04-male-01'
    motivo: 'rejeitada pelo founder'
  - id: '05-chadwick'
    motivo: 'rejeitada pelo founder'
  - id: '09-female-01 no engine F5-TTS'
    motivo: '"muito ruim" — a MESMA voz é aprovada no 23-Lang, então o defeito é do engine'

  # ── conjunto ESTUDO — bom de ouvido, mas não publicável ───────────────────
  estudo:
  - id: '07-narrador-estoico-clonado · 23-Lang · ref 20s'
    veredito: validado
    atencao: >
      APROVAÇÃO ESTÉTICA, NÃO LIBERAÇÃO DE USO. Continua com `pode_publicar: nao`
      — a restrição é de direito de voz, e ouvido não resolve direito. É o melhor
      clone do banco e o alvo de qualidade a alcançar por meio legítimo.
  - id: '07-narrador-estoico-clonado · 23-Lang · ref 14s'
    veredito: validado_com_observacao
    observacao: >
      Sotaque português de Portugal em "noites" e "diário que"; o R final de
      "maior" saiu deformado.
  - id: '07-narrador-estoico-clonado · PT-BR · ref 20s'
    veredito: validado_com_observacao
    observacao: >
      Ponto final indevido depois de "do mundo", que quebrou a continuidade com
      "e escrevia todas as noites"; pausa sem sentido depois de "Nele".

  # ── timing de SRT — decidido ──────────────────────────────────────────────
  timing:
    smart_natural: validado
    pad_with_silence: validado
    stretch_to_fit:
      veredito: REJEITADO
      motivo: 'atrasa a fala e distorce'
      consequencia: >
        SAI das opções do squad. Nenhum job novo deve usá-lo. A medição já
        apontava (WER 15,8%) e o ouvido confirmou.

  # ── registro grave: as três restritas ─────────────────────────────────────
  registro_grave:
    morgan_freeman: 'perto, mas não é — "voz boa, entonações ruins, não seguem a coerência das frases"'
    attenborough: 'perto, INTERESSANTE APRIMORAR — "leve sotaque, mas salva para testes"'
    eastwood: 'perto — "algumas palavras estranhas, mas aproveitável para mais aprimoramento"'
    leitura: >
      Nenhuma das três foi rejeitada por TIMBRE. As três foram ressalvadas por
      ENTONAÇÃO. Ver a síntese abaixo.

# ─────────────────────────────────────────────────────────────────────────────
# A SÍNTESE QUE MUDA A PRIORIDADE DO SQUAD
sintese_da_validacao:
  achado: >
    Em 9 das 10 observações escritas pelo founder, a queixa é de PROSÓDIA — pausa
    no lugar errado, sílaba tônica errada, ponto final onde não havia, entonação
    que não segue a coerência da frase. Praticamente nenhuma queixa é de TIMBRE.
  consequencia: >
    O gargalo do pack de locução NÃO é escolher uma voz melhor. É dirigir melhor a
    voz que já temos. Trocar de voz não resolve um problema de direção.
  onde_esta_a_alavanca:
  - 'O SRT é a partitura de prosódia — fronteira de cue decide respiração e ênfase (data/oratoria-e-prosodia.yaml)'
  - 'Pontuação do texto de entrada: o modelo lê ponto final como queda de entonação. "do mundo." vs "do mundo," muda a frase inteira.'
  - 'Palavra com sílaba tônica errada pode ser reescrita ou soletrada foneticamente na entrada'
  proximo_teste_de_maior_retorno: >
    Pegar a MESMA voz já aprovada (02-voz-casa-23lang ou 03-male-02) e variar só a
    PONTUAÇÃO e as fronteiras de cue do SRT, nas frases exatas que o founder citou.
    Isso isola prosódia de voz — que é o que nenhum teste até agora fez.

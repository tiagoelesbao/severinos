    sim: 'Uso livre em peça publicada, inclusive monetizada'
    nao: 'APENAS estudo e calibração de registro. Nunca publicar.'
    a_definir: 'Depende de decisão ou contrato ainda não fechado'
  origem:
    embutida: 'Voz que vem no próprio modelo — não há referência, não pertence a ninguém'
    banco_da_suite: 'Áudio de referência que acompanha a TTS-Audio-Suite'
    clonada: 'Clonada a partir de gravação de terceiro'
    propria: 'Gravada pelo founder ou contratada'


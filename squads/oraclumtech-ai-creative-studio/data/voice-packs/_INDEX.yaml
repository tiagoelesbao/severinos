# ─────────────────────────────────────────────────────────────────────────────
# BANCO DE VOZES — catálogo por narrador
#
# Cada pasta é um NARRADOR. Dentro dela: a referência (quando houver) e as
# amostras da MESMA frase, geradas em modelos diferentes, para comparação justa.
#
# Consumido por: @sound-designer (`audio`), @exec-producer (aprovação de uso)
#
# COMO USAR
#   1. Ouça as amostras da pasta do narrador
#   2. Confira `pode_publicar` antes de escolher — é o campo que decide
#   3. A referência (`referencia.wav`) é o que se aponta no workflow de narração
#
# FRASE PADRÃO DE TESTE (todas as amostras dizem a mesma coisa):
#   "Marco Aurélio governava o maior império do mundo. E escrevia, todas as
#    noites, um diário que nunca pretendeu publicar. Nele, não há ordens.
#    Há dúvidas. O homem mais poderoso de Roma passava as madrugadas tentando
#    convencer a si mesmo a ser melhor no dia seguinte."
#
# WER = taxa de erro de palavra, medida transcrevendo o áudio gerado de volta
#       com Whisper. Mede FIDELIDADE AO ROTEIRO, não qualidade estética nem
#       sotaque — para isso, ouvido humano.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  versao: '1.0.0'
  criado_em: '2026-08-29'
  squad: oraclumtech-ai-creative-studio
  total_narradores: 11
  total_amostras: 14
  engines_testados: ['ChatterBox 23-Lang v3', 'ChatterBox PT-BR (ResembleAI)', 'F5-TTS PT-BR']

# ─────────────────────────────────────────────────────────────────────────────
# LEGENDA DOS CAMPOS
legenda:

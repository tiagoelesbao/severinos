  # ── Transmissão contínua ────────────────────────────────────────────────────
  # Os três gêneros abaixo vieram da mineração de `lives-niches-playbook.yaml`.
  # Eles rompem uma premissa comum a P1–P6: a peça deixa de ser um arquivo entregue
  # e passa a ser um CANAL no ar. Por isso são diff contra P5 (o único com artefato
  # persistente de canal), não contra os pipelines de peça única.
  #
  # `novela-recap` é o único dos três que começa episódico e SÓ DEPOIS vira live —
  # por isso ele abre a seção.

  - id: novela-recap
    status: backlog
    nome: 'Recap de novela (canal dark diário — vídeo longo na fase 1, live contínua na fase 2)'
    identificador_reservado: P7
    nota_de_identificador: >
      DIVERGÊNCIA FECHADA AQUI. "P7 novela-recap" já aparecia em
      `data/local-generation-stack.yaml` (lacunas 1 e 2b) e em `docs/NARRACAO-LOCAL.md`
      (§2.5) como se fosse um pipeline implementado — e não existia neste catálogo.
      Não é pipeline implementado: `P7` é o número RESERVADO deste gênero. Enquanto não
      houver perfil próprio em `pipeline-profiles.yaml`, ele roda como `P5 + delta`, e é
      o `pipeline_ref` abaixo que vale na execução. Quem for implementar escreve o
      profile P7 partindo do P5 e move `status` para `active`.
    objetivo_de_negocio: >
      Capturar, todo dia, a audiência que busca "o que aconteceu no capítulo de ontem"
      e convertê-la em watch time monetizável num canal sem rosto. O ativo é a CADÊNCIA:
      quem chega para o recap de segunda volta na terça. O produto é o resumo narrado
      com voz e elenco próprios — nunca o sinal da emissora, nunca o capítulo.
    canal_alvo: [youtube-long, youtube-live, youtube-shorts, tiktok, instagram-reels]
    duracao_tipica: 'episódio de 5–10 min, cadência diária (6–7 por semana); loop de live na fase 2'
    formato: ['16:9', '9:16']
    formato_master: '16:9'
    kpi_primario: 'watch time absoluto acumulado no mês (fase 1) → horas assistidas por transmissão (fase 2)'
    kpi_secundario: ['CTR de thumbnail', 'espectadores simultâneos médios', 'RPM', 'retorno diário (views por espectador único na semana)']
    elenco_convocado:
      - studio-chief
      - exec-producer
      - research-scout
      - head-of-copy
      - character-lead
      - image-lead
      - motion-lead
      - editor
      - sound-designer
      - fact-checker
      - qa-critic
    pipeline_ref: 'P5 + delta'
    delta_from: P5
    requer_artefato_persistente: channel-brief.yaml
    custo_relativo: 'baixo por episódio, ALTO na primeira semana (o elenco tem que ser construído antes do primeiro recap)'
    ciclo_tipico: 'lote semanal — uma sessão de produção cobre 6–7 episódios'
    aceita_cliente: [farming, interno-oraclum]
    duas_fases:
      fase_1_aquecimento:
        o_que_e: >
          Publicar episódios comuns (vídeo longo diário) antes de qualquer transmissão.
          Serve a dois propósitos ao mesmo tempo: tirar o canal do período inicial em que
          a plataforma ainda não distribui, e construir o acervo de loops que a fase 2 vai
          transmitir. Sinal de saída: o painel começar a mostrar impressão e recomendação
          em vez de view zerada.
        confianca_da_fonte: baixa
        nota: >
          O termo que o curso usa para esse período inicial chega corrompido na
          transcrição — a intenção é legível, o nome dele não. Ver
          `lives-niches-playbook.yaml → transversal.aquecimento_antes_da_primeira_live`.
      fase_2_live:
        o_que_e: >
          Os episódios já produzidos passam a rodar em LOOP dentro do OBS, transmitidos
          como live contínua na faixa de horário da novela na TV — abre um pouco antes,
          fecha no fim da programação. A unidade de trabalho deixa de ser o vídeo e passa
          a ser o canal no ar.
        pre_requisito: 'Fase 1 concluída e acervo de loops montado. Não se começa por aqui.'
        infra: 'VPS, não a máquina do operador — a mesma restrição do `live-stats-panel`.'
    o_que_muda:
      - 'Cadência vira restrição de primeira classe. O `exec-producer` deixa de orçar episódio a episódio e passa a orçar LOTE SEMANAL: uma sessão de produção (sábado ou domingo) alimenta 6–7 peças. É política de produção, não preferência de agenda.'
      - 'O `head-of-copy` escreve o roteiro CORRIDO, sem separar por dia. Quebrar em capítulos devolve ao espectador pontos naturais de saída; o corrido mantém o loop de curiosidade aberto. É o mesmo princípio do `codigo_de_retencao` do dark-room, com caso concreto.'
      - 'Entra `character-lead` — que o P5 não convoca. Elenco de novela é FIXO e reaparece todo dia por meses: sem identidade travada, a mesma personagem sai com rosto diferente a cada episódio. É a lacuna 2b do `local-generation-stack.yaml` (LoRA por personagem é a rota recomendada justamente por causa deste gênero).'
      - 'O `stills` muda de critério: imagem escolhida por AÇÃO (chorando, discutindo, descobrindo), nunca por retrato neutro. Vale como regra de prompt na geração local, não só como curadoria.'
      - 'O `assembly` ganha um parâmetro default duro: troca de imagem a cada ~3s com micro-movimento. Aperta o `codigo_de_b_roll` do dark-room ("nenhum plano acima de 4s"). Peça de locução sobre still parada é tela travada.'
      - 'A narração é o produto, e vem da voz canônica do canal (ChatterBox 23L, voz embutida — ver `docs/NARRACAO-LOCAL.md` §2.5). Trocar de voz entre episódios reseta o reconhecimento acumulado; num gênero diário, isso custa mais do que em qualquer outro.'
      - 'O `research` inverte a origem do briefing: a pauta vem do calendário da NOVELA (resumo dos capítulos da semana em portal público), não do calendário do estúdio. Sem novela no ar, não há episódio.'
      - 'A fase 2 muda a natureza da entrega: de arquivo para SESSÃO no ar, com janela de início e encerramento — mesmo delta operacional do `live-stats-panel`.'
    perfil_de_direitos:
      classificacao: 'MISTO — o núcleo é defensável, a rota de imagem do método de origem NÃO é'
      o_que_e_limpo:
        - 'O resumo narrado é obra derivada de sinopse e fato público, com texto e voz próprios'
        - 'A camada visual GERADA localmente (FLUX.2 klein + Wan 2.2) não tem titular de terceiro — é a diferença que torna este gênero viável aqui e inviável no método de origem'
      o_que_e_arriscado:
        - 'Frame de obra audiovisual protegida ou foto de terceiro colhida em busca de imagens — é a fonte de imagem do curso, e ela não entra'
        - 'Nome e imagem de ator ou marca de emissora em título e thumbnail'
      recusado_por_decisao_do_founder:
        - 'Título-isca com marca de emissora ("Globo ao vivo HD") — sugere retransmissão de sinal'
        - 'Trocar título/thumbnail e cortar a gravação no YouTube Studio antes da revisão de monetização'
        - '"Aplicar edição" (espelhar, filtrar, cortar) sobre imagem de terceiro para não acusar duplicado — contorna o detector, não o titular'
    bloqueio_antes_de_sair_do_backlog: >
      A camada visual precisa ser 100% gerada ou licenciada, sem exceção — o que muda a
      economia do nicho em relação ao método de origem e é exatamente o que precisa ser
      medido antes de virar oferta. Depende também da lacuna 2b (consistência de
      personagem) sair de `a_validar_no_estudio`: sem elenco estável, o formato diário
      não se sustenta. O `fact-checker` opera a lista `recusado` acima como bloqueio.
    fonte: 'squads/oraclumtech-ai-creative-studio/data/lives-niches-playbook.yaml → nichos[novelas]'

  - id: live-stats-panel
    status: backlog
    # PERMANECE em backlog de propósito: promover gênero é decisão do founder, não da
    # classificação (tasks/classify-genre.md). O que mudou é que o bloqueio caiu.
    bloqueio_original_resolvido:
      em: '2026-09-05'
      qual: >
        "Capturar a tela de um provedor de placar é violação de ToS; a rota correta é
        painel próprio." Resolvido exatamente por essa rota: painel desenhado por nós,
        alimentado pelos endpoints públicos que a própria ESPN usa no site. Zero
        captura de tela.
      implementacao: 'apps/live-futebol/'
    pronto_para_promocao_quando:
      - 'Os testes de OBS pendentes forem concluídos'
      - 'Um jogo completo for validado do início ao fim (não um trecho)'
    retomada_combinada: '≈2026-09-12 — uma semana após a publicação do piloto do VOD'
    estado_real: 'montado e ensaiado; AINDA NÃO foi ao ar. Ver MEMORY.md §6.5'
    nome: 'Painel de dados ao vivo (transmissão contínua orientada a evento)'
    objetivo_de_negocio: >
      Capturar audiência que já está buscando um evento em andamento (jogo, eleição,
      lançamento, leilão) e retê-la em um painel de dados próprio atualizando em
      tempo real. O conteúdo é o DADO, não a narrativa — e dado é fato, o que dá a
      este gênero o melhor perfil de direitos de todo o catálogo.
    canal_alvo: [youtube-live, twitch, painel-embarcado-em-site-cliente]
    duracao_tipica: '4-6h por evento, ou contínua enquanto o evento durar'
    formato: ['16:9']
    kpi_primario: 'horas assistidas acumuladas por transmissão'
    kpi_secundario: ['espectadores simultâneos médios', 'RPM por mercado geográfico', 'inscritos por transmissão']
    elenco_convocado: [studio-chief, exec-producer, research-scout, art-director, editor, sound-designer, fact-checker, qa-critic]
    pipeline_ref: 'P5 + delta'
    delta_from: P5
    o_que_muda:
      - 'A entrega deixa de ser um arquivo e passa a ser uma SESSÃO no ar. O `delivery` vira operação de transmissão (janela de início, duração, encerramento) e exige infraestrutura persistente — VPS, não a máquina do operador.'
      - 'Somem `stills` e `takes` como estágios dominantes: o que ocupa a tela é interface de dados, não imagem gerada. Entra `design` (art-director) como estágio pesado — grid, hierarquia tipográfica, legibilidade de número em movimento.'
      - 'Fonte de dados vira insumo de primeira classe com licença nomeada. Capturar a tela de um provedor de placar é violação de termos de serviço; a rota correta é API licenciada renderizada em painel próprio. RESOLVIDO em 2026-09-05 por painel próprio + endpoints públicos da ESPN. A conta que elimina as alternativas pagas: ~110 min de jogo consultando a cada 30 s = 220 requisições por partida, contra os 100/DIA do free tier de API-Football e KickoffAPI — não cobrem um único jogo.'
      - 'O `research` inverte a ordem do briefing: a decisão de produzir vem do calendário do EVENTO, não do calendário do estúdio.'
      - 'Áudio é leito ambiente, nunca trilha — em peça de 5h, trilha licenciada é risco e custo sem contrapartida.'
      - 'Ganha um dispositivo de retenção sem rosto (elemento vivo em loop no canto da composição) como item obrigatório de `assinatura_substituta` no channel-brief.'
    fonte: 'squads/oraclumtech-ai-creative-studio/data/lives-niches-playbook.yaml → nichos[esportes]'

  - id: live-music-loop
    status: backlog
    nome: 'Loop musical contínuo (canal de música gerada)'
    objetivo_de_negocio: >
      Monetizar audiência de escuta longa (estudo, sono, foco, infantil) com faixas
      GERADAS pelo estúdio, rodando em loop por meses sem intervenção. Custo marginal
      próximo de zero depois do loop montado; o ativo é o canal, não a faixa.
    canal_alvo: [youtube-live, youtube-long]
    duracao_tipica: 'loop de ~30 min (≈10 faixas), transmitido continuamente'
    formato: ['16:9']
    kpi_primario: 'horas assistidas acumuladas por mês'
    kpi_secundario: ['espectadores simultâneos médios', 'RPM por mercado', 'reescuta (views por ouvinte único)']
    elenco_convocado: [studio-chief, exec-producer, research-scout, head-of-copy, sound-designer, image-lead, editor, fact-checker, qa-critic]
    pipeline_ref: 'P5 + delta'
    delta_from: P5
    o_que_muda:
      - 'O `sound-designer` deixa de ser acabamento e vira o estágio dominante: a peça É o áudio. O vídeo é um plano vivo em movimento lento, não uma decupagem.'
      - 'Some o estágio de locução; some o roteiro. Entra composição: letra por LLM + prompt de estilo de até ~200 caracteres, gerada com titularidade comercial verificada (ver playbook § perfil_de_direitos).'
      - 'Ambiência e SFX NÃO vêm do gerador de música — vêm de acervo licenciado ou de banco próprio. Achado de campo registrado no playbook: gerador de música falha em chuva/rio e acerta em faixa com estrutura.'
      - 'Gate novo e duro no `factcheck`: título não pode prometer efeito fisiológico (Hz, hormônio, cura de estresse) nem citar artista real. É o ponto onde o método de origem foi recusado e onde ele volta com mais facilidade.'
      - 'Declaração de conteúdo gerado por IA é obrigatória na publicação — não é decisão de alcance.'
      - 'Sub-nicho infantil exige regime próprio (feito-para-crianças) que altera monetização e comentários; tratar como gênero à parte se for perseguido.'
    fonte: 'squads/oraclumtech-ai-creative-studio/data/lives-niches-playbook.yaml → nichos[musicas]'

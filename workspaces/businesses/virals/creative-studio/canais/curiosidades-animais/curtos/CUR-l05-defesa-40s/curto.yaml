    - {q: "sea cucumber underwater", etiqueta: "dois-opepinodom", n: 3, exige: [cucumber], ancora: "Numero Dois o pepino-do-mar",
       imagem: "photorealistic underwater photograph of a sea cucumber on the sandy seabed, dark warty body, tube feet visible, clear shallow water, wildlife documentary still, vertical composition"}
    - {q: "gecko lizard on wall", etiqueta: "um-alagartixa", n: 3, exige: [gecko, lizard], ancora: "Numero Um a lagartixa de cauda destacavel",
       imagem: "photorealistic macro photograph of a gecko on a rough stone wall, detached tail lying nearby on the ground, warm evening light, wildlife documentary still, vertical composition"}

# ── O QUE MUDOU EM RELAÇÃO AO PILOTO ────────────────────────────────────
aprendizados:
  - >
    O ROTEIRO FOI REESCRITO DEPOIS DA EMBALAGEM. O gancho nasceu do título
    anterior ("ganhou e reclama") e não cumpria a thumb aprovada ("foi pra cima
    do árbitro"). Reescrito para abrir pelo confronto. É o pipeline funcionando
    como desenhado: a embalagem manda no roteiro, não o contrário.
  - >
    MARCADOR DE IMAGEM NÃO VAI NO ROTEIRO DESTE CANAL. Escrevi [img NN] no corpo
    (padrão do canal estoico) e o TTS sintetizou o placeholder dele em inglês
    dentro do mp3 — 11 cues de lixo, achadas só pela auditoria de WER. O
    narra_comfy agora filtra linha que é só [...].
  - >
    A THUMB USOU FOTO DE PORTAL, autorizado pelo founder. A ESPN só tem retrato
    de 2 dos 49 atletas do elenco, e a variante_confronto do thumb-system fica
    inexecutável sem isso.

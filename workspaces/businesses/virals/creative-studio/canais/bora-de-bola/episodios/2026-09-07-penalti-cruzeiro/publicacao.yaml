# ── O CUIDADO QUE ATRAVESSA ESTE EPISÓDIO ───────────────────────────────
fidelidade:
  ponto_critico: >
    O diálogo que viralizou é LEITURA LABIAL, publicada pelo influenciador
    Velloso — e o próprio autor declarou margem de erro e disse que trechos
    ilegíveis foram retirados. Não é transcrição.
  como_o_roteiro_trata: >
    Toda vez que as frases entram, entram precedidas da atribuição. O BLOCO 3 é
    inteiro dedicado a separar o que a leitura labial APONTA do que a
    transmissão PROVA (discussão antes, discussão depois, dedo levantado).
  como_as_cartelas_tratam: >
    As duas cartelas de diálogo levam o rótulo
    'leitura labial · velloso · com margem de erro declarada'.
  o_que_o_canal_nao_afirma:
    - que existe briga ou rompimento entre os dois
    - que o diálogo foi dito exatamente daquele jeito
    - que algum dos dois foi punido pelo clube
    - que o Botafogo aceitou a proposta do Tigres (a fonte diz que avalia)
  nota_sobre_a_thumb: >
    A frase da thumb do painel direito é direção editorial do founder, decidida
    por ele em 07/09 depois de eu levantar que a fonte não a sustenta. Fica
    registrado aqui porque o claim-ledger é o lugar onde a diferença entre o
    que se afirma no vídeo e o que se escreve na embalagem tem de estar visível.


  dependência do Pixel nativo da plataforma (passo 1 do plano de migração

  Pixel nativo deles (Events Manager > Test Events), o campo "Facebook

  IMPORTANTE — Tag Sequencing: a tag "HTML personalizado" (captura de
  fbp/fbc/UTM, apps/utm-capture-imperio) precisa dessa tag rodando ANTES
  dela, senão lê o cookie _fbp/_fbc antes de existir. Configurar em
  Advanced Settings > Tag Sequencing > "Fire a tag before this one" na

# Formato documentado em _MODELO.yaml

projeto:
  nome: imperio
  cliente: Imperio Premios
  peca: dia-das-criancas-2026
personagem:
  rosto: bruno-face.png
  corpo: bruno-body.png
  voz: voz-ref-04.wav
  voz_corte: 4

    overhead, concrete underfoot - no dirt roads, no open countryside.
  panorama_pronto: pano-sp-aprovado.png
  setores:
  - chave: VIELA
    angulo: 30
    rotulo: viela de cimento
    erp: >-
      a narrow concrete alley between tall bare brick walls, thick tangled power

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Império — Campanhas</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens extraídos do DOM real de imperiopremioss.com em 2026-10-10
   (getComputedStyle, não estimativa): fundo rgb(22,28,36), texto branco,
   fonte Montserrat, header 70px, badge verde rgb(25,135,84) raio 6px,
   título de seção 18px/600, subtítulo 13px/400 rgb(69,79,91), card com
   imagem quadrada 600x600. O objetivo é continuidade visual — o usuário
   deve sentir que já está dentro do site do cliente. */
:root{
  --bg:#161C24;
  --surface:#1C252E;
  --txt:#fff;
  --muted:#454F5B;
  --verde:#198754;
  --borda:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--txt);
  font-family:Montserrat,"Public Sans",sans-serif;
  min-height:100dvh;
}
header{
  height:70px;display:flex;align-items:center;justify-content:center;
  padding:0 16px;position:sticky;top:0;z-index:10;
  background:rgba(22,28,36,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--borda);
}
header img{height:40px;width:auto;display:block}
main{max-width:680px;margin:0 auto;padding:18px 16px 40px}
.sec{margin-bottom:14px}
.sec h1{font-size:18px;font-weight:600;line-height:1.3}
.sec p{font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.grid{display:flex;flex-direction:column;gap:18px}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--borda);
  border-radius:12px;overflow:hidden;
  transition:transform .15s ease,border-color .15s ease;
}
.card:active{transform:scale(.99)}
@media(hover:hover){.card:hover{border-color:rgba(255,255,255,.18)}}
.thumb{position:relative;width:100%;aspect-ratio:1/1;background:#0f141a}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{
  position:absolute;left:10px;top:10px;
  background:var(--verde);color:#fff;
  font-size:11px;font-weight:600;line-height:1;
  border-radius:6px;padding:5px 9px;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.info{padding:12px 14px 14px}
.info h2{font-size:15px;font-weight:600;line-height:1.35}
.info .chamada{font-size:12.8px;font-weight:300;line-height:1.4;margin-top:5px;opacity:.92}
.info .preco{
  display:inline-block;margin-top:10px;
  font-size:12px;font-weight:700;letter-spacing:.2px;
  background:rgba(25,135,84,.14);color:#4ade80;
  border:1px solid rgba(25,135,84,.35);
  border-radius:999px;padding:5px 11px;
}
.estado{padding:40px 8px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.sk{background:var(--surface);border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.sk .b{background:linear-gradient(90deg,#1C252E 25%,#243039 37%,#1C252E 63%);background-size:400% 100%;animation:sh 1.3s ease-in-out infinite}
.sk .b1{width:100%;aspect-ratio:1/1}
.sk .b2{height:14px;margin:14px 14px 0;border-radius:4px}
.sk .b3{height:11px;width:62%;margin:9px 14px 16px;border-radius:4px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk .b{animation:none}.card{transition:none}}
footer{text-align:center;padding:8px 16px 28px;color:var(--muted);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>

<header><img src="logo.png" alt="Império" /></header>

<main>
  <div class="sec">
    <h1>⚡ Campanhas</h1>
    <p>Escolha sua sorte</p>
  </div>
  <div class="grid" id="grid">
    <div class="sk"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
    <div class="sk"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
  </div>
</main>

<footer>Império · 18+ · Jogue com responsabilidade</footer>

<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2276849516022676');
fbq('track', 'PageView');

function gerarEventId(){
  return 'cat.' + Date.now() + '.' + Math.floor(Math.random()*1e9);
}

// Beacon próprio (2026-10-16): mesmo padrão das 3 LPs — grava em paralelo
// na tabela lp_eventos (/api/beacon), variant='catalogo'.
function obterSessionIdLp() {
  try {
    var sid = sessionStorage.getItem('lp_session_id');
    if (!sid) {
      sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : gerarEventId();
      sessionStorage.setItem('lp_session_id', sid);
    }
    return sid;
  } catch (e) { return null; }
}
function mandarBeacon(evento, extra) {
  try {
    var qs = new URLSearchParams(window.location.search);
    fetch('/api/beacon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        variant: 'catalogo',
        evento: evento,
        session_id: obterSessionIdLp(),
        utm_source: qs.get('utm_source') || null,
        utm_campaign: qs.get('utm_campaign') || null,
      }),
      keepalive: true,
    });
  } catch (e) {}
}

// Nome próprio pra esta etapa do funil (2026-10-15): "PageView" sozinho não
// distingue pressel de catálogo de /campanha/{slug} — todos disparam o
// mesmo pixel. Ver PresselPageView em index.html/v2/v3.
fbq('trackCustom', 'CatalogoPageView', {}, { eventID: gerarEventId() });
mandarBeacon('CatalogoPageView');

// A query string de ENTRADA (utm_* e fbclid vindos do url_tags do anúncio)
// é propagada para o destino, mais o marcador `lp=1`. Mesmo padrão do
// index.html: é o que faz a UTM sobreviver até o pedido e o que permite ao
// GTM do cliente gravar o cookie `ic_origem=pressel`, que por sua vez
// dispara o evento PurchaseLandingPage na compra.
var ENTRADA = new URLSearchParams(window.location.search);

function montarDestino(slug){
  var url = new URL('https://rapidinhas24hr.com/campanha/' + encodeURIComponent(slug));
  ENTRADA.forEach(function(v,k){ url.searchParams.set(k,v); });
  url.searchParams.set('lp','1');
  return url.toString();
}

function escapar(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatarPreco(p){
  var n = parseFloat(p);
  if (!isFinite(n) || n <= 0) return '';
  return 'R$ ' + n.toFixed(2).replace('.',',');
}

function render(sorteios){
  var grid = document.getElementById('grid');
  if (!sorteios || !sorteios.length){
    grid.innerHTML = '<div class="estado">Nenhuma campanha aberta neste momento.<br>Novas rodadas saem várias vezes ao dia — volte em instantes.</div>';
    return;
  }
  grid.innerHTML = sorteios.map(function(s){
    var preco = formatarPreco(s.preco);
    return '<a class="card" href="' + escapar(montarDestino(s.slug)) + '" data-slug="' + escapar(s.slug) + '">' +
      '<div class="thumb">' +
        (s.imagem ? '<img src="' + escapar(s.imagem) + '" alt="" loading="lazy" />' : '') +
        '<span class="badge">' + escapar(s.chamada || 'Adquira Já!') + '</span>' +
      '</div>' +
      '<div class="info">' +
        '<h2>' + escapar(s.titulo) + '</h2>' +
        (s.chamada ? '<div class="chamada">' + escapar(s.chamada) + '</div>' : '') +
        (preco ? '<span class="preco">' + preco + '</span>' : '') +
      '</div>' +
    '</a>';
  }).join('');

  grid.querySelectorAll('.card').forEach(function(a){
    a.addEventListener('click', function(){
      // Nome distinto do ClickSorteios da pressel (index.html/v2/v3): aquele
      // mede "clicou pra ver o catálogo", este mede "escolheu um sorteio
      // específico dentro do catálogo" — etapa mais profunda do funil.
      try { fbq('trackCustom','ClickSorteiosCatalogo',{ content_name: a.dataset.slug }, { eventID: gerarEventId() }); } catch(e){}
      mandarBeacon('ClickSorteiosCatalogo');
    });
  });
}

function carregar(){
  fetch('/api/sorteios', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      // Distinguir "sem campanha aberta" de "não consegui buscar": antes
      // ambos caíam no mesmo texto, e a página afirmava que não havia
      // sorteio quando na verdade a API tinha falhado.
      if (!d || d.ok === false) throw new Error('api');
      render(d.sorteios);
    })
    .catch(function(){
      document.getElementById('grid').innerHTML =
        '<div class="estado">Não consegui carregar as campanhas agora.<br>Tente recarregar a página.</div>';
    });
}
carregar();

// Sorteio encerra rápido e vira página de 404 no destino. Se a aba ficar
// aberta, o catálogo se atualiza sozinho ao voltar ao primeiro plano e a
// cada 60s — evita mandar clique pago para sorteio morto.
setInterval(carregar, 60000);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') carregar();
});
</script>
</body>
</html>
